interface:
  display_name: "JUGEST Live Analysis"
  short_description: "Automatically judge Juggler screenshots with JUGEST"
  default_prompt: "このスクショを判別して"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "jugest"
      description: "Run authoritative JUGEST Juggler judgement and read authorized JUGEST store data"
      transport: "streamable_http"
      url: "https://jugest.net/mcp"
