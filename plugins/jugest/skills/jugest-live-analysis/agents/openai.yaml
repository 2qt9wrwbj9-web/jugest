interface:
  display_name: "JUGEST Live Analysis"
  short_description: "Automatically judge Juggler screenshots with JUGEST"
  default_prompt: "このスクショをJUGESTで全台判別して"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "jugest"
      description: "Automatically use JUGEST for current-machine Juggler judgement; read authorized store data only when requested"
      transport: "streamable_http"
      url: "https://jugest.net/mcp"
