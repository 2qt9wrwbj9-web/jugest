- Added an empirical-Bayes setting-distribution prior learned only from observed externalJudge() P1–P6 outputs across lifetime/current store, machine, weekday, day-of-month, and date-tail contexts. The original externalJudge() posterior remains unchanged and visible; the store-aware posterior is a separate layer used for live-play integration and move comparison so long-running store knowledge can reduce low-sample over/under-shoot.

- Nested-validation power tuning: pre-declared store-level cross features may pass the middle confirmation gate at p<=.08 / BH q<=.16 only when discovery p<=.02, same-direction/effect-size checks already passed, and the feature is pooled across machines after machine-baseline residualization. This does not promote a model by itself; the untouched model-validation window still has to clear the stricter Champion gates.
- Prediction-horizon hardening: all v4 predictive training is now capped to the latest 180 completed store-days, matching the established walk-forward policy and preventing stale regimes from accumulating indefinitely. The chronological split was widened to roughly 45% discovery / 20% feature confirmation / 35% untouched model validation so weekly and low-frequency observable patterns receive enough independent validation dates within a 180-day horizon. A six-active-date sparse-model exception exists only under much stricter p-value, win-rate, block-reproducibility, and effect gates.
- Major architecture release: evolved the tool from a standalone setting discriminator into an end-to-end Juggler decision-support workflow. Added a daily strategy home, store digital-twin summaries, a second deterministic predictive-model family, Champion/Challenger selection, model agreement, probability calibration, store-level high-setting-share constraints, walk-forward replay, diversified target portfolios, real-play prior/posterior integration, and a dedicated move-comparison workflow.

- Added move recommendation and comparison. The current table keeps the original judgement posterior separate from the store-model prior; the integrated P4+ is calculated as a Bayesian group-prior update without modifying externalJudge() or the detailed judgement posterior itself. Candidate tables are proposed from pre-play predictions only, then the user can open 移動比較 and enter that table's current G/BB/RB/difference before a continue / consider move / move-favored comparison is shown. Short-lived reversals are damped and comparison history is retained.

- Added root-evidence redundancy control inside each v4 predictor: direct and crossed conditions that reuse the same underlying feature root can still contribute, but overlapping evidence is strongly down-weighted so weekday + weekday×table-tail or prior-difference + prior-difference×weekday cannot masquerade as independent votes.

- Forecast aim scores now use an absolute evidence scale instead of always normalizing the best table to 100. If no table clears the validated-evidence floor, the forecast explicitly says there is not enough statistical reason to target a table.
- Reworked exhaustive generation to stream global discovery p-values while retaining detailed objects only for pre-declared confirmation hypotheses and promising exploration candidates. Global BH still uses every unique tested cohort; this reduces peak memory without reducing the multiple-comparison denominator.
- No change to reverse-difference external setting judgement, unknown-play-style mixtures, IndexedDB persistence, personal run records, or imported JSON schemas.

[v3.13.0 test — 2026-08-22]
- Hardened 店舗データ「腕力分析」 after 180-day synthetic-store forecasting tests. Discovery significance is now calculated from the chronological discovery window only; later data is reserved for multi-block out-of-sample validation.
- Added rolling validation blocks, out-of-sample mean effect/win rate/stability, and stricter S/A grading. A pattern can no longer earn top confidence from one favorable late segment alone.
- Added Benjamini-Yekutieli strict FDR (q厳格) alongside global Benjamini-Hochberg exploratory FDR to guard against the heavy dependence created by tens/hundreds of thousands of correlated pattern tests.
- General partial-day patterns are now compared within the same machine/day before aggregation, preventing machine placement from being misread as a table-block/table-number effect.
- Added exact-cohort deduplication before FDR, proxy/high-cardinality penalties, and alias counts so deterministic/near-duplicate cuts do not multiply evidence.
- Strength/forecast effect is now shrunk toward zero and weighted toward out-of-sample validation rather than the full-period in-sample effect. Confidence explicitly incorporates OOS blocks, OOS win rate, stability, strict FDR, sample size, repeatability, complexity, and proxy risk.
- Added 腕力分析「次回狙い台」. It builds the next-date feature vector from prior data only, matches validated store/machine patterns, deduplicates overlapping evidence families, and ranks tables by conservative predicted uplift. Target date can be changed manually.
- Forecast ranking is a relative targeting aid, not a guaranteed setting prediction. No current-target-day BB/RB/difference is used.
- No change to external reverse-difference setting judgement, IndexedDB storage, personal run records, or trend-matrix calculations.

- Added 1/2/3/5/7-day history cuts for cumulative difference, expected-setting history, loss/high-setting frequency, zero-bonus frequency, average games, combined bonus rate, and RB share where applicable.

- Machine-specific brute force now treats the machine as a separate scope and can combine it with up to the selected number of pattern conditions, enabling direct cuts such as machine × calendar day × long-run slump.
- Added semantic-family and high-cardinality compatibility rules so deterministic/redundant combinations (for example exact calendar day × date ending, or exact table × table ending) are not misrepresented as independent multi-condition discoveries. All 79 axes are tested individually; two-way searches cover the meaningful cross-family combinations, while three-way searches use explicit date/table/history schemas to keep iPhone runtime practical without presenting deterministic or redundant combinations as discoveries.
- All retained candidates still share one global Benjamini-Hochberg FDR correction pool and the existing discovery/validation, repeatability, sample, complexity, strength, confidence, and overfit-risk scoring.

function v510AggView(list){let a=aggregate(list||[]);return{n:a.n,totalG:a.totalG,actualG:a.actualG,actualDiff:a.actualDiff,expectedDiff:a.expectedDiff,expectedDiffActual:a.expectedDiffActual,win:a.win,actualN:a.actualN,winRate:a.winRate,actualRate:a.actualRate,expectedRate:a.expectedRate,expectedSetting:a.expectedSetting}}
function v510GetCalendarDay(ds){let rows=(sessions||[]).filter(r=>String(r.date||'')===String(ds||'')).sort((a,b)=>(+a.id||0)-(+b.id||0));return{date:String(ds||''),summary:v510AggView(rows),rows:rows.map(v510RecordRow)}}
function v510GetRecordsBreakdown(opts={}){
 let list=(sessions||[]).slice(),year=+opts.year||0,month=+opts.month||0;
 if(year&&month){let prefix=`${year}-${String(month).padStart(2,'0')}`;list=list.filter(r=>String(r.date||'').startsWith(prefix))}
 let machines=[];for(let k of ALL_MACHINE_KEYS){let x=list.filter(r=>r.machine===k),a=v510AggView(x);if(a.n)machines.push({key:k,name:analysisMachineName(k),...a})}
 let shopRows=[];(shops||[]).forEach(sh=>{let x=list.filter(r=>String(r.shopId)===String(sh.id)),a=v510AggView(x);if(a.n)shopRows.push({id:String(sh.id),name:sh.name,...a})});
 let shopMachine=[];(shops||[]).forEach(sh=>ALL_MACHINE_KEYS.forEach(k=>{let x=list.filter(r=>String(r.shopId)===String(sh.id)&&r.machine===k),a=v510AggView(x);if(a.n)shopMachine.push({shopId:String(sh.id),shopName:sh.name,machine:k,machineName:analysisMachineName(k),...a})}));
 let monthMachine=machines.map(x=>({...x}));
 return{summary:v510AggView(list),machines,shops:shopRows,shopMachine,monthMachine}
}
