  if(errors)notices.push({tone:'error',icon:'!',title:`${errors}店舗で取得エラー`,meta:missing?`欠損 ${missing}日を含みます。`:'直近エラーを確認してください。',target:'data'});
  else if(missing)notices.push({tone:'warning',icon:'!',title:`欠損 ${missing}日を確認`,meta:'再取得対象を確認できます。',target:'data'});
  else if(linked&&checked&&!checkError)notices.push({tone:'success',icon:'✓',title:'取得エラーなし',meta:'直近のCollector状態に問題はありません。',target:'data'});
  notices.push({tone:'success',icon:'✓',title:`解析データ ${days}日分`,meta:'必要な画面を開いた時だけ遅延解析します。',target:'data'});
  const notifications=notices.filter(n=>n.tone!=='success');
  return{statusLabel,statusTone,notices:notices.slice(0,3),notifications,notificationCount:notifications.length};

function workspaceLabel(key){return({home:'ホーム',judgement:'判別',live:'実戦',store:'店舗',records:'記録',data:'データ'})[key]||'ホーム'}
function workspaceIcon(key){return({home:'⌂',judgement:'▥',live:'◎',store:'▦',records:'▤',data:'⇅'})[key]||'•'}
function validWorkspace(value){return WORKSPACES.includes(value)?value:'home'}

function liveCounterRate(g,count){const G=Number(g),n=Number(count);return Number.isFinite(G)&&G>0&&Number.isFinite(n)&&n>0?'1/'+(G/n).toFixed(2):'—'}
function liveGrapeRate(j){const d=j?.defs?.find(d=>d.id==='grape'||/ぶどう/.test(d.name));return d&&d.enabled?liveCounterRate(j.G,d.value):'—'}
function liveBellRate(h){const s=h?.session||{};return liveCounterRate(Number(s.currentG)-Number(s.startG),s.bell)}

function liveCompactDistribution(q,prefix,ready,labels){
 const data=Array.from({length:6},(_,i)=>Number(q?.[i]||0)),colors=['#c6d0fa','#a8b9fa','#8ba0f6','#6f89f2','#5271eb','#3657dd'];

 return `<div class="live-compact-distribution">
  <div class="live-compact-band" role="img" aria-label="${active?data.map((n,i)=>`設定${labels?.[i]||i+1} ${pct(n)}`).join('、'):'未判別'}">${data.map((n,i)=>`<span data-${prefix}-band="${i}" style="width:${active?n*100:0}%;background:${colors[i]}"></span>`).join('')}</div>
  <div class="live-compact-probs">${data.map((n,i)=>`<span><small>${esc(labels?.[i]||i+1)}</small><b data-${prefix}-q="${i}">${active?pct(n):'—'}</b></span>`).join('')}</div>
 </div>`;
}
function livePatchDistribution(root,q,prefix,ready,labels){
 const nums=Array.from({length:6},(_,i)=>Number(q?.[i]||0)),active=!!ready&&nums.every(n=>Number.isFinite(n)&&n>=0)&&nums.reduce((a,b)=>a+b,0)>.99;
 for(let i=0;i<6;i++){const e=root.querySelector(`[data-${prefix}-band="${i}"]`);if(e)e.style.width=(active?nums[i]*100:0)+'%';}
 const b=root.querySelector('.live-compact-band');if(b)b.setAttribute('aria-label',active?nums.map((n,i)=>`設定${labels?.[i]||i+1} ${pct(n)}`).join('、'):'未判別');
}

  newObservedRow(value={machine:'my'}){return{id:String(++this.observed.seq),input:global.JUGESTJudgement.inputRow(value),result:null,errors:{}}}
  observedDraftError(drafts){
    if(!drafts||drafts.version!==1||!Array.isArray(drafts.rows))return '入力の保存形式を確認できません。';
    if(drafts.rows.length>1000)return '並列入力が1,000行を超えています。保存するには行数を減らしてください。';
    const labels={machine:'機種',tableNo:'台番',games:'G',bb:'BB',rb:'RB',diff:'差枚'};
    for(const value of [...(drafts.single==null?[]:[drafts.single]),...Array.from(drafts.rows)]){
      if(!value||typeof value!=='object'||Array.isArray(value))return '保存できない形式の入力行があります。';
      for(const key of global.JUGESTJudgement.FIELDS){
        const text=value[key];if(text==null)continue;
        if(!['string','number'].includes(typeof text)||(typeof text==='number'&&!Number.isFinite(text)))return `${labels[key]}に保存できない形式の値があります。`;
        if(String(text).length>2048)return `${labels[key]}が2,048文字を超えています。保存するには入力を短くしてください。`;
      }
    }
    return '';
  }
  restoreObservedDrafts(drafts){
    if(this.observedDraftError(drafts))return;
    if(drafts.single!=null)this.observed.single=this.newObservedRow(drafts.single);
    this.observed.rows=drafts.rows.map(value=>this.newObservedRow(value));

een();if(this.state.workspace==='data'&&this.state.screen==='stores')return this.renderStoreManagementScreen();if(this.state.workspace==='data'&&this.state.screen==='import')return this.renderJsonImportScreen();if(this.state.workspace==='data'&&this.state.screen==='sync')return this.renderSyncScreen();if(this.state.workspace==='data'&&this.state.screen==='backup')return this.renderBackupScreen();const titles={rev:'後ヅモ',move:'移動比較',compare:'台比較',plan:'今日の作戦',analysis:'店舗解析',replay:'リプレイ',model:'モデル性能',log:'稼働記録',calendar:'カレンダー',strategy:'立ち回り分析',collector:'自動取得・取込',stores:'店舗管理',backup:'バックアップ'};const title=titles[this.state.screen]||workspaceLabel(this.state.workspace);return `<section class="workspace"><button class="back-row" type="button" data-workspace="${this.state.workspace}">‹ ${workspaceLabel(this.state.workspace)}</button><div class="kicker">${esc(this.state.workspace.toUpperCase())}</div><h1>${esc(title)}</h1><div class="error-panel">画面を読み込めなかったよ。ホームからもう一度開いてね。</div></section>`}

  hanaShortName(k){return({houou:'ホウオウ',king:'キング',dragon:'ドラゴン',star:'スター',newkingv:'ニューキングV'})[k]||k}
  hanaResultPanel(h,mode='live'){const r=mode==='rev'?h?.reverseResult:h?.liveResult;if(!r){return `<section class="panel hana-result"><div class="empty-card">データを入れるとここに判別結果が出るよ。</div></section>`}const q=r.q||[],m=h.config||{},metrics=r.metrics||null,warnings=r.warnings||[];return `<section class="panel hana-result"><div class="judge-result-top"><div><small>期待設定</small><strong data-hana-es>${metrics?fmtES(metrics.expectedSetting):'—'}</strong></div><div class="judge-pills"><span><small>設定4+</small><b data-hana-p4>${metrics?pct(metrics.p4):'—'}</b></span><span><small>${m.labels?.at(-1)==='V'?'設定V':'最上位'}</small><b data-hana-top>${metrics?pct(metrics.pTop):'—'}</b></span></div></div>${mode==='live'?liveCompactDistribution(q,'hana',!!metrics,m.labels):''}<div class="prob-strip hana-prob-strip">${(m.labels||[]).map((label,i)=>`<div><small>${esc(label)}</small><b data-hana-q="${i}">${q.length?pct(q[i]||0):'—'}</b></div>`).join('')}</div>${mode==='rev'?`<div class="hana-reverse-est"><span><small>推定ベル</small><b data-hana-bell>${r.reverse&&Number.isFinite(r.reverse.inferredDenom)?'1/'+r.reverse.inferredDenom.toFixed(2):'—'}</b></span><span><small>推定回数</small><b data-hana-bell-count>${r.reverse&&Number.isFinite(r.reverse.inferredBell)?Math.round(r.reverse.inferredBell)+'回':'—'}</b></span></div>`:''}<div class="judge-warning" data-hana-warning ${warnings.length?'':'hidden'}>${esc(warnings.join(' / '))}</div>${mode==='live'&&r.own?.factors?.length?`<details class="hana-factors"><summary>使用した判別要素</summary>${r.own.factors.map(f=>`<div class="${f.used?'':'off'}"><b>${esc(f.label)}</b><small>${esc(f.detail||'')}</small></div>`).join('')}</details>`:''}</section>`}
  hanaCounter(label,path,value,scope='live'){return `<article class="metric-card"><div class="metric-head"><b>${esc(label)}</b></div><div class="metric-control"><button type="button" data-hana-count="${esc(path)}" data-hana-scope="${scope}" data-delta="-1">−</button><input type="number" min="0" inputmode="numeric" data-hana-field="${esc(path)}" data-hana-scope="${scope}" value="${esc(value??'')}" placeholder="0"><button type="button" data-hana-count="${esc(path)}" data-hana-scope="${scope}" data-delta="1">＋</button></div></article>`}
  renderHanaMachineSelect(h){return `<label class="machine-select"><small>機種</small><select data-hana-machine>${(h.machines||[]).map(m=>`<option value="${esc(m.key)}" ${m.key===h.machine?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>`}
  renderHanaReverseScreen(){const h=this.state.hana||this.bridge()?.getHanaState?.();if(!h)return `<section class="workspace"><div class="error-panel">HANA判別状態を読み込めなかったよ。</div></section>`;this.state.hana=h;const x=h.rev||{},styles=[['unknown','不明（3パターン混合）'],['random','適当打ち'],['cherry','チェリー狙い'],['perfect','小役完全取得']];return `<section class="workspace hana-screen"><button class="back-row" type="button" data-workspace="live">‹ 実戦</button><div class="kicker">HANA</div><h1>ハナハナ後ヅモ</h1><div class="hana-toolbar">${this.renderHanaMachineSelect(h)}<label><small>前任者の打ち方</small><select data-hana-style data-hana-field="style" data-hana-scope="rev">${styles.map(([v,t])=>`<option value="${v}" ${x.style===v?'selected':''}>${t}</option>`).join('')}</select></label></div>${this.hanaResultPanel(h,'rev')}<section class="panel hana-basic-grid"><label><small>通常G</small><input data-hana-field="G" data-hana-scope="rev" type="number" inputmode="numeric" min="0" value="${esc(x.G||'')}" placeholder="0"></label><label><small>BIG</small><input data-hana-field="bb" data-hana-scope="rev" type="number" inputmode="numeric" min="0" value="${esc(x.bb||'')}" placeholder="0"></label><label><small>REG</small><input data-hana-field="rb" data-hana-scope="rev" type="number" inputmode="numeric" min="0" value="${esc(x.rb||'')}" placeholder="0"></label><label><small>差枚</small><input data-hana-field="diff" data-hana-scope="rev" type="number" inputmode="numeric" value="${esc(x.diff??'')}" placeholder="例 850"></label></section><div class="hana-actions"><button class="secondary-btn" type="button" data-hana-reset="rev">クリア</button><button class="primary-btn" type="button" data-hana-begin>このデータから判別開始</button></div></section>`}
  renderHanaJudgeScreen(){const h=this.state.hana||this.bridge()?.getHanaState?.();if(!h)return `<section class="workspace"><div class="error-panel">HANA判別状態を読み込めなかったよ。</div></section>`;this.state.hana=h;const s=h.session,m=h.config||{};if(!s)return `<section class="workspace hana-screen"><button class="back-row" type="button" data-workspace="live">‹ 実戦</button><div class="kicker">HANA</div><h1>ハナハナ判別</h1><div class="hana-toolbar">${this.renderHanaMachineSelect(h)}</div><div class="info-card"><b>判別セッション未開始</b><span>0Gから始めるか、ハナハナ後ヅモで前任者データを入力してから開始できる。</span></div><div class="hana-actions"><button class="primary-btn" type="button" data-hana-zero>0Gから判別開始</button><button class="secondary-btn" type="button" data-action="live-hana-pickup">前任者データを入力</button></div></section>`;const side=(m.sideColors||[]),bigAfter=(m.bigAfterColors||[]),regAfter=(m.regAfterColors||[]);return `<section class="workspace hana-screen hana-compact"><div class="live-compact-heading"><button class="back-row" type="button" data-workspace="live">‹ 実戦</button><h1>ハナハナ判別</h1><small>LIVE</small></div><div class="hana-toolbar">${this.renderHanaMachineSelect(h)}<div class="hana-session-meta"><small>開始G</small><b>${formatCount(s.startG,'G')}</b></div></div>${this.hanaResultPanel(h,'live')}<section class="panel hana-basic-grid"><label><small>現在G</small><input data-hana-field="currentG" data-hana-scope="live" type="number" inputmode="numeric" min="0" value="${esc(s.currentG??'')}" placeholder="0"></label><label><small>着席後BIG</small><input data-hana-field="bb" data-hana-scope="live" type="number" inputmode="numeric" min="0" value="${esc(s.bb??'')}" placeholder="0"></label><label><small>着席後REG</small><input data-hana-field="rb" data-hana-scope="live" type="number" inputmode="numeric" min="0" value="${esc(s.rb??'')}" placeholder="0"></label></section><section class="hana-bell-priority">${this.hanaCounter('🔔 ベル','bell',s.bell)}<div class="live-compact-rate"><span>実測ベル確率 · 自分のG数</span><strong data-hana-live-bell>${liveBellRate(h)}</strong></div></section><details class="hana-detail" open><summary>BIG中小役</summary><div class="metric-grid">${this.hanaCounter('対象G','bigGames',s.bigGames)}${this.hanaCounter('スイカ','bigWater',s.bigWater)}${this.hanaCounter('ハズレ','bigMiss',s.bigMiss)}</div><div class="live-compact-rate"><span>BIG中スイカ確率</span><strong data-hana-live-water>${liveWaterRate(h)}</strong></div></details><details class="hana-detail"><summary>${esc(m.sideContext||'サイドランプ')}</summary><div class="metric-grid">${side.map((c,i)=>this.hanaCounter(c,`sideCounts.${i}`,s.sideCounts?.[i]||'')).join('')}</div></details><details class="hana-detail"><summary>${esc(m.bigAfterName||'BIG後ランプ')}</summary><div class="hana-basic-grid compact"><label><small>対象BIG回数</small><input data-hana-field="normalBigTrials" data-hana-scope="live" type="number" inputmode="numeric" min="0" value="${esc(s.normalBigTrials??'')}"></label><label class="hana-check"><input type="checkbox" data-hana-field="firstBigSeparated" data-hana-scope="live" ${s.firstBigSeparated?'checked':''}><span>設定変更後の初回BIGを別カウント</span></label></div><div class="metric-grid">${bigAfter.map((c,i)=>this.hanaCounter(c,`bigAfterCounts.${i}`,s.bigAfterCounts?.[i]||'')).join('')}</div></details><details class="hana-detail"><summary>REG後ランプ</summary><div class="metric-grid">${regAfter.map((c,i)=>this.hanaCounter(c,`regAfterCounts.${i}`,s.regAfterCounts?.[i]||'')).join('')}</div></details><details class="hana-detail"><summary>レトロサウンド${m.regWater?' / REG中スイカ':''}</summary><div class="metric-grid">${this.hanaCounter('条件達成','retroTrials',s.retroTrials)}${this.hanaCounter('レトロ発生','retroHits',s.retroHits)}${m.regWater?this.hanaCounter('REG中対象G','regGames',s.regGames):''}${m.regWater?this.hanaCounter('REG中スイカ','regWater',s.regWater):''}</div></details><div class="hana-actions"><button class="secondary-btn" type="button" data-hana-reset="live">判別セッション終了</button><button class="primary-btn" type="button" data-record-save-current="hana" ${!h.liveResult?.selfG?'disabled':''}>この判別を稼働記録へ</button></div></section>`}
  patchHanaResult(scope='live'){const h=this.state.hana;if(!h||!this.shadowRoot)return;const r=scope==='rev'?h.reverseResult:h.liveResult,metrics=r?.metrics,q=r?.q||[];const set=(sel,val)=>{const el=this.shadowRoot.querySelector(sel);if(el)el.textContent=val};set('[data-hana-es]',metrics?fmtES(metrics.expectedSetting):'—');set('[data-hana-p4]',metrics?pct(metrics.p4):'—');set('[data-hana-top]',metrics?pct(metrics.pTop):'—');q.forEach((v,i)=>set(`[data-hana-q="${i}"]`,pct(v)));if(scope==='live'){set('[data-hana-live-bell]',liveBellRate(h));set('[data-hana-live-water]',liveWaterRate(h));livePatchDistribution(this.shadowRoot,q,'hana',!!metrics,h.config?.labels);}if(scope==='rev'){set('[data-hana-bell]',r?.reverse&&Number.isFinite(r.reverse.inferredDenom)?'1/'+r.reverse.inferredDenom.toFixed(2):'—');set('[data-hana-bell-count]',r?.reverse&&Number.isFinite(r.reverse.inferredBell)?Math.round(r.reverse.inferredBell)+'回':'—')}const w=this.shadowRoot.querySelector('[data-hana-warning]');if(w){w.textContent=(r?.warnings||[]).join(' / ');w.hidden=!(r?.warnings||[]).length}if(scope==='live'){const save=this.shadowRoot.querySelector('[data-record-save-current="hana"]');if(save)save.disabled=!r?.selfG}}

  renderJudgeScreen(){const j=this.state.judge||this.bridge()?.getJudgeState?.();if(!j)return `<section class="workspace"><div class="error-panel">判別状態を読み込めなかったよ。</div></section>`;this.state.judge=j;const groups=['small','big','reg'].filter(g=>j.defs.some(x=>x.group===g));return `<section class="workspace judge-screen judge-compact"><div class="live-compact-heading"><button class="back-row" type="button" data-workspace="live">‹ 実戦</button><h1>実戦判別</h1><small>LIVE</small></div>${this.renderLiveTabs('judge')}<details class="judge-context-details"><summary><b>${esc(j.machineName)}</b><small>${esc(j.context?.shopName||this.state.activeStore||'店舗未選択')} · ${esc(j.context?.date||'日付未設定')} · 台${esc(j.context?.tableNo||'—')}</small><span>台情報 ▾</span></summary><section class="judge-context"><button type="button" data-open-store-selector><small>店舗</small><b>${esc(j.context?.shopName||this.state.activeStore||'店舗を選択')}</b><span>⌄</span></button><label><small>日付</small><input type="date" data-judge-date value="${esc(j.context?.date||'')}"></label><label><small>台番</small><input inputmode="numeric" data-judge-table value="${esc(j.context?.tableNo||'')}" placeholder="例 412"></label><label class="machine-select"><small>機種</small><select data-judge-machine>${j.machines.map(m=>`<option value="${esc(m.key)}" ${m.key===j.machine?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label></section></details><section class="judge-result panel"><div class="judge-result-top"><div><small>期待設定</small><strong data-judge-es>${j.G?fmtES(j.expectedSetting):'—'}</strong></div><div class="judge-pills"><span><small>設定4+</small><b data-judge-p4>${j.G?pct(j.p4):'—'}</b></span><span><small>設定5+</small><b data-judge-p5>${j.G?pct(j.p5):'—'}</b></span><span><small>設定6</small><b data-judge-p6>${j.G?pct(j.p6):'—'}</b></span></div></div>${liveCompactDistribution(j.q,'judge',!!j.G)}<div class="judge-warning" data-judge-warning ${j.warning?'':'hidden'}>${esc(j.warning||'')}</div></section><section class="judge-g panel"><label><span>通常G</span><input data-judge-g type="number" inputmode="numeric" min="0" value="${j.G||''}" placeholder="0"></label></section><div class="judge-counter-groups">${groups.map(g=>`<section class="metric-group" data-metric-group="${g}"><div class="section-label">${groupLabel(g)}</div><div class="metric-grid">${j.defs.filter(x=>x.group===g).map(d=>`<article class="metric-card ${d.enabled?'':'off'}"><div class="metric-head"><b>${esc(d.name)}</b><label class="switch"><input type="checkbox" data-judge-enable="${esc(d.id)}" ${d.enabled?'checked':''}><span></span></label></div><div class="metric-control"><button type="button" data-judge-step="${esc(d.id)}" data-delta="-1">−</button><input type="number" min="0" inputmode="numeric" data-judge-metric="${esc(d.id)}" value="${d.value||''}" placeholder="0"><button type="button" data-judge-step="${esc(d.id)}" data-delta="1">＋</button></div></article>`).join('')}</div>${g==='small'?`<div class="live-compact-rate"><span>🍇 実測ぶどう確率</span><strong data-judge-grape>${liveGrapeRate(j)}</strong></div>`:''}</section>`).join('')}</div><button class="primary-cta record-save-cta" type="button" data-record-save-current="judge" ${!j.G?'disabled':''}>この判別を稼働記録へ</button></section>`}
  patchJudgeResult(j){const root=this.shadowRoot;if(!root)return;const set=(sel,val)=>{const el=root.querySelector(sel);if(el)el.textContent=val};set('[data-judge-es]',j.G?fmtES(j.expectedSetting):'—');set('[data-judge-p4]',j.G?pct(j.p4):'—');set('[data-judge-p5]',j.G?pct(j.p5):'—');set('[data-judge-p6]',j.G?pct(j.p6):'—');j.q?.forEach((v,i)=>set(`[data-judge-q="${i}"]`,j.G?pct(v):'—'));set('[data-judge-grape]',liveGrapeRate(j));livePatchDistribution(root,j.q,'judge',!!j.G);const w=root.querySelector('[data-judge-warning]');if(w){w.textContent=j.warning||'';w.hidden=!j.warning}const save=root.querySelector('[data-record-save-current="judge"]');if(save)save.disabled=!j.G}

  renderReverseScreen(){const j=this.bridge()?.getJudgeState?.()||{},machine=this.state.rev.machine||j.machine||'my';this.state.rev.machine=machine;let z=this.bridge()?.getReverseState?.(this.state.rev)||{},styles=this.bridge()?.getReverseStyles?.(machine)||[],pickup=this.bridge()?.getPickupState?.(machine)||this.state.pickup;this.state.pickup=pickup;return `<section class="workspace reverse-screen rev-compact"><div class="rev-head"><button class="back-row" type="button" data-workspace="live">‹ 実戦</button><h1>後ヅモ</h1><span>LIVE</span></div>${this.renderLiveTabs('rev')}<div class="rev-toolbar"><label><small>機種</small><select data-rev-machine>${(z.machines||j.machines||[]).map(m=>`<option value="${esc(m.key)}" ${m.key===machine?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><label><small>前任者</small><select data-rev-style>${styles.map(s=>`<option value="${esc(s.value)}" ${s.value===this.state.rev.style?'selected':''}>${esc(s.label)}</option>`).join('')}</select></label></div><section class="rev-input panel"><label><small>通常G</small><input data-rev-g type="number" inputmode="numeric" min="0" value="${esc(this.state.rev.G)}" placeholder="0"></label><label><small>BB</small><input data-rev-b type="number" inputmode="numeric" min="0" value="${esc(this.state.rev.B)}" placeholder="0"></label><label><small>RB</small><input data-rev-r type="number" inputmode="numeric" min="0" value="${esc(this.state.rev.R)}" placeholder="0"></label><label><small>差枚</small><input data-rev-d type="number" inputmode="numeric" value="${esc(this.state.rev.D)}" placeholder="+1200"></label></section><section class="judge-result panel rev-result"><div class="judge-result-top"><div><small>期待設定</small><strong data-rev-es>${z.G?fmtES(z.expectedSetting):'—'}</strong></div><div class="judge-pills"><span><small>4+</small><b data-rev-p4>${z.G?pct(z.p4):'—'}</b></span><span><small>5+</small><b data-rev-p5>${z.G?pct(z.p5):'—'}</b></span><span><small>6</small><b data-rev-p6>${z.G?pct(z.p6):'—   renderPickupPanel(p){const groups=['small','big','reg'].filter(g=>p.defs?.some(x=>x.group===g));return `<section class="pickup-wrap"><div class="section-label">着席後の自分データ</div><section class="panel pickup-head"><div><small>打ち出しG</small><input data-pickup-start-g type="number" value="${p.startG}" inputmode="numeric"></div><div><small>現在G</small><input data-pickup-current-g type="number" value="${p.currentG}" inputmode="numeric"></div><div><small>自分の実戦</small><b data-pickup-self>${p.selfG}G</b></div><button type="button" class="mini-danger" data-pickup-end>終了</button></section><section class="judge-result panel"><div class="judge-result-top"><div><small>合成期待設定</small><strong data-pickup-es>${fmtES(p.expectedSetting)}</strong></div><div class="judge-pills"><span><small>4+</small><b data-pickup-p4>${pct(p.p4)}</b></span><span><small>5+</small><b data-pickup-p5>${pct(p.p5)}</b></span><span><small>6</small><b data-pickup-p6>${pct(p.p6)}</b></span></div></div><div class="judge-warning" data-pickup-warning ${p.warning?'':'hidden'}>${esc(p.warning||'')}</div></section>${groups.map(g=>`<section class="metric-group"><div class="section-label">${groupLabel(g)}</div><div class="metric-grid">${p.defs.filter(x=>x.group===g).map(d=>`<article class="metric-card ${d.enabled?'':'off'}"><div class="metric-head"><b>${esc(d.name)}</b><label class="switch"><input type="checkbox" data-pickup-enable="${esc(d.id)}" ${d.enabled?'checked':''}><span></span></label></div><div class="metric-control compact"><input type="number" min="0" inputmode="numeric" data-pickup-metric="${esc(d.id)}" value="${d.value||''}" placeholder="0"></div></article>`).join('')}</div></section>`).join('')}<button class="primary-cta record-save-cta" type="button" data-record-save-current="pickup" ${!p.selfG?'disabled':''}>この合成判別を稼働記録へ</button></section>`}
  patchReverseResult(z){const r=this.shadowRoot,set=(sel,val)=>{const e=r.querySelector(sel);if(e)e.textContent=val};set('[data-rev-es]',z.G?fmtES(z.expectedSetting):'—');set('[data-rev-p4]',z.G?pct(z.p4):'—');set('[data-rev-p5]',z.G?pct(z.p5):'—');set('[data-rev-p6]',z.G?pct(z.p6):'—');set('[data-rev-denom]',z.denom?'1/'+z.denom.toFixed(2):'—');set('[data-rev-count]',z.estimatedCount!=null?z.estimatedCount+'回':'—');set('[data-rev-bb-odds]',revOdds(z.G,z.B));set('[data-rev-rb-odds]',revOdds(z.G,z.R));set('[data-rev-total-odds]',revOdds(z.G,Number(z.B)+Number(z.R)));set('[data-rev-range]',z.range||'—');const row=r?.querySelector('[data-rev-range-row]');if(row)row.hidden=!z.range;const q=Array.from({length:6},(_,i)=>Number(z.q?.[i])),valid=!!z.G&&q.every(v=>Number.isFinite(v)&&v>=0)&&q.reduce((a,b)=>a+b,0)>.99;for(let i=0;i<6;i++){set(`[data-rev-q="${i}"]`,valid?pct(q[i]):'—');const item=r?.querySelector(`[data-rev-band="${i}"]`);if(item)item.style.width=`${valid?q[i]*100:0}%`}const bar=r?.querySelector('.rev-probs-band');if(bar)bar.setAttribute('aria-label',valid?q.map((v,i)=>`設定${i+1} ${pct(v)}`).join('、'):'未判別');const w=r?.querySelector('[data-rev-warning]');if(w){w.textContent=z.warning||'';w.hidden=!z.warning}const begin=r?.querySelector('[data-pickup-begin]');if(begin)begin.disabled=!z.G||String(z.D??'').trim()===''}

  renderStoreDataScreen(){const name=this.state.activeStore||'',dates=this.bridge()?.getStoreDates?.(name,120)||[];if(!dates.includes(this.state.storeDate))this.state.storeDate=dates[0]||'';const day=this.bridge()?.getStoreDay?.(name,this.state.storeDate)||{rows:[]},rows=day.rows||[],shown=rows.slice(0,this.state.storeDataLimit);return `<section class="workspace store-data-screen"><button class="back-row" type="button" data-workspace="store">‹ 店舗</button><div class="kicker">STORE</div><button class="store-title compact" type="button" data-open-store-selector><span>${esc(name||'店舗を選択')}</span><span class="store-down">⌄</span></button>${this.renderStoreTabs('data')}<div class="data-toolbar"><label><small>日付</small><select data-store-date>${dates.map(d=>`<option value="${esc(d)}" ${d===this.state.storeDate?'selected':''}>${esc(d)}</option>`).join('')}</select></label><span>${rows.length}台</span></div>${rows.length?`<div class="machine-list">${shown.map(r=>`<article class="machine-row"><div class="machine-no">${esc(r.tableNo)}</div><div class="machine-main"><b>${esc(r.machineName)}</b><small>G ${formatCount(r.games)} / BB ${r.bb} / RB ${r.rb}</small></div><div class="machine-right"><b class="${Number(r.diff)>=0?'plus':'minus'}">${fmtDiff(r.diff)}</b><small>${Number.isFinite(r.expectedSetting)?`期待 ${fmtES(r.expectedSetting)}`:'未判別'}</small></div></article>`).join('')}</div>${rows.length>shown.length?'<button class="more-btn" type="button" data-store-more>さらに表示</button>':''}`:'<div class="empty-card">この日の台データはないよ。</div>'}</section>`}

  renderRecordsLogScreen(){const b=this.bridge(),sum=b?.getRecordsSummary?.()||{},rows=b?.getRecentRecords?.(this.state.recordLimit)||[];return `<section class="workspace records-screen"><button class="back-row" type="button" data-workspace="records">‹ 記録</button><div class="kicker">RECORDS</div><h1>稼働記録</h1><div class="records-summary"><div><small>稼働</small><b>${formatCount(sum.n,'件')}</b></div><div><small>総G</small><b>${formatCount(sum.totalG,'G')}</b></div><div><small>実差枚</small><b class="${Number(sum.actualDiff)>=0?'plus':'minus'}">${sum.actualN?fmtDiff(sum.actualDiff):'—'}</b></div></div><div class="record-list">${rows.map(r=>`<article class="record-row record-card" data-record-row><div class="record-date"><b>${esc(r.date||'—')}</b><small>${esc(r.entryLabel||'')}</small></div><div class="record-main"><b>${esc(r.machineName||r.machine||'')}</b><small>${esc(r.shopName||'店舗未選択')} / ${r.tableNo?esc(r.tableNo)+'番':'台番なし'} / ${formatCount(r.playedG,'G')}</small>${r.tags?.length?`<div class="record-tags">${r.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}${r.memo?`<em>${esc(r.memo)}</em>`:''}</div><div class="record-result"><b class="${r.hasActual?(Number(r.actualDiff)>=0?'plus':'minus'):''}">${r.hasActual?fmtDiff(r.actualDiff):'—'}</b><small>期待 ${fmtES(r.expectedSetting)}</small></div><div class="record-card-actions"><button type="button" data-record-edit="${esc(String(r.id))}">編集</button><button type="button" class="danger-text" data-record-delete="${esc(String(r.id))}">削除</button></div></article>`).join('')||'<div class="empty-card">まだ稼働記録はないよ。実戦判別から「この判別を記録」で保存できる。</div>'}</div>${rows.length<this.state.recordLimit?'':`<button class="more-btn" type="button" data-record-more>さらに表示</button>`}</section>`}
  renderRecordEditor(){const p=this.state.recordEditor;if(!p)return `<section class="workspace"><button class="back-row" type="button" data-action="records-log">‹ 稼働記録</button><div class="empty-card">編集する稼働記録がないよ。</div></section>`;const o=this.bridge()?.getRecordOptions?.()||{shops:[],tags:[]},selected=new Set((p.tagIds||[]).map(String)),fin=this.bridge()?.previewRunFinance?.(p)||{},f=fin.finance||{},title=p.id!=null?'稼働記録を編集':'この判別を記録';return `<section class="workspace record-editor-screen"><button class="back-row" type="button" data-record-cancel>‹ 稼働記録</button><div class="kicker">RECORDS</div><h1>${title}</h1><div class="info-card"><b>${esc(p.machineName||p.machine||'')}</b><span>${p.entryType==='pickup'?'後ヅモ':'朝イチ'} / ${formatCount(p.playedG,'G')} / 期待設定 ${fmtES(Number.isFinite(+p.expectedSetting)?+p.expectedSetting:(Array.isArray(p.q)?p.q.reduce((a,v,i)=>a+(+v||0)*(i+1),0):NaN))}</span></div><section class="panel record-edit-grid"><label><small>日付</small><input data-record-field="date" type="date" value="${esc(p.date||'')}"></label><label><small>台番号</small><input data-record-field="tableNo" inputmode="numeric" value="${esc(p.tableNo||'')}" placeholder="例 512"></label><label class="full"><small>店舗</small><select data-record-field="shopId"><option value="">店舗未選択</option>${(o.shops||[]).map(sh=>`<option value="${esc(sh.id)}" ${String(p.shopId||'')===String(sh.id)?'selected':''}>${esc(sh.name)}</option>`).join('')}</select></label><label><small>打ち出しG</small><input data-record-field="startG" type="number" inputmode="numeric" min="0" value="${esc(p.startG??0)}"></label><label><small>終了G</small><input data-record-field="endG" type="number" inputmode="numeric" min="0" value="${esc(p.endG??0)}"></label></section><div class="section-label">収支</div><section class="panel record-edit-grid"><label><small>貸出（1000円あたり枚）</small><input data-record-field="loanCoinsPer1000" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(p.loanCoinsPer1000??'')}" placeholder="例 46"></label><label><small>交換（1000円あたり枚）</small><input data-record-field="exchangeCoinsPer1000" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(p.exchangeCoinsPer1000??'')}" placeholder="例 52"></label><label><small>貯メダル投資（枚）</small><input data-record-field="savedInvestCoins" type="number" inputmode="numeric" min="0" value="${esc(p.savedInvestCoins??'')}"></label><label><small>現金投資（円）</small><input data-record-field="cashInvestYen" type="number" inputmode="numeric" min="0" step="1000" value="${esc(p.cashInvestYen??'')}"></label><label><small>回収枚数</small><input data-record-field="collectedCoins" type="number" inputmode="numeric" min="0" value="${esc(p.collectedCoins??'')}"></label><label><small>換金額</small><input data-record-field="exchangedYen" type="number" inputmode="numeric" min="0" value="${esc(p.exchangedYen??'')}"></label><label class="full"><small>換金に使った枚数（任意補正）</small><input data-record-field="exchangeUsedCoinsOverride" type="number" inputmode="numeric" min="0" value="${esc(p.exchangeUsedCoinsOverride??'')}" placeholder="通常は自動計算"></label></section>${fin.active?`<div class="finance-preview"><div><small>実差枚</small><b class="${Number(f.actualDiff)>=0?'plus':'minus'}">${Number.isFinite(f.actualDiff)?fmtDiff(f.actualDiff):'—'}</b></div><div><small>現金収支</small><b class="${Number(f.cashDiff)>=0?'plus':'minus'}">${Number.isFinite(f.cashDiff)?fmtYen(f.cashDiff):'—'}</b></div><div><small>貯玉増減</small><b class="${Number(f.savedCoinDelta)>=0?'plus':'minus'}">${Number.isFinite(f.savedCoinDelta)?fmtDiff(f.savedCoinDelta):'—'}</b></div></div>`:''}<div class="section-label">狙い根拠</div><section class="panel"><div class="record-tag-chips">${(o.tags||[]).map(t=>`<button type="button" class="${selected.has(String(t.id))?'on':''} ${t.active?'':'past'}" data-record-tag="${esc(t.id)}">${esc(t.name)}${t.active?'':'（過去）'}</button>`).join('')||'<span class="muted">タグなし</span>'}</div><div class="record-tag-add"><input data-record-tag-name value="${esc(this.state.recordTagName)}" placeholder="新しい狙い根拠"><button type="button" data-record-add-tag>追加</button></div><details class="record-tag-admin"><summary>タグを管理</summary><div>${(o.tags||[]).filter(t=>t.active).map(t=>`<span><b>${esc(t.name)}</b><button type="button" data-record-tag-disable="${esc(t.id)}">選択肢から外す</button></span>`).join('')||'<small>管理できるタグはないよ。</small>'}</div><p>削除しても、過去の稼働に付いている分は残る。</p></details></section><label class="record-memo"><small>メモ</small><textarea data-record-field="memo" rows="4" placeholder="例：末尾7本命 / 店内状況良好">${esc(p.memo||'')}</textarea></label><div class="record-editor-actions"><button type="button" class="secondary-btn" data-record-cancel>キャンセル</button><button type="button" class="primary-btn" data-record-save>稼働記録を保存</button></div></section>`}
  renderCalendarScreen(){const d=this.state.calendarCursor,y=d.getFullYear(),m=d.getMonth()+1,b=this.bridge(),cal=b?.getCalendarMonth?.(y,m)||{days:[],summary:{}},breakdown=b?.getRecordsBreakdown?.({year:y,month:m})||{monthMachine:[]},sel=this.state.calendarSelectedDate,day=sel?b?.getCalendarDay?.(sel):null;return `<section class="workspace calendar-screen"><button class="back-row" type="button" data-workspace="records">‹ 記録</button><div class="kicker">RECORDS</div><div class="calendar-head"><button type="button" data-calendar-month="prev">‹</button><h1>${y}年 ${m}月</h1><button type="button" data-calendar-month="next">›</button></div><div class="calendar-week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="calendar-grid">${(cal.days||[]).map(x=>`<button type="button" data-calendar-date="${esc(x.date)}" class="calendar-cell ${x.inMonth?'':'out'} ${x.count?'has':''} ${sel===x.date?'selected':''}"><b>${x.day}</b>${x.count?`<small class="${Number(x.actualDiff)>=0?'plus':'minus'}">${x.hasActual?fmtDiff(x.actualDiff):'—'}</small><em>${x.count}件</em>`:''}</button>`).join('')}</div><div class="records-summary month"><div><small>稼働</small><b>${formatCount(cal.summary?.n,'件')}</b></div><div><small>実差枚</small><b class="${Number(cal.summary?.actualDiff)>=0?'plus':'minus'}">${cal.summary?.actualN?fmtDiff(cal.summary.actualDiff):'—'}</b></div><div><small>期待差枚</small><b>${fmtDiff(cal.summary?.expectedDiff)}</b></div></div><div class="section-label">月次機種レポート</div><div class="calendar-machine-report">${(breakdown.monthMachine||[]).map(r=>`<article><div><b>${esc(r.name)}</b><small>${r.n}件 / ${formatCount(r.totalG,'G')} / 勝率 ${Number.isFinite(r.winRate)?r.winRate.toFixed(1)+'%':'—'}</small></div><div><b>${r.actualN?fmtDiff(r.actualDiff):'—'}</b><small>平均設定 ${fmtES(r.expectedSetting)}</small></div></article>`).join('')||'<div class="empty-card">この月の機種別データはまだないよ。</div>'}</div>${day?`<div class="section-label">${esc(day.   renderRecordsAnalysisScreen(){const b=this.bridge(),a=b?.getRecordsSummary?.()||{},d=b?.getRecordsBreakdown?.({})||{machines:[],shops:[],shopMachine:[]};const card=(r,label=r.name)=>`<article class="analysis-breakdown-row"><div><b>${esc(label||'')}</b><small>${r.n}件 / ${formatCount(r.totalG,'G')} / 勝率 ${Number.isFinite(r.winRate)?r.winRate.toFixed(1)+'%':'—'}</small></div><div><b class="${r.actualN?(Number(r.actualDiff)>=0?'plus':'minus'):''}">${r.actualN?fmtDiff(r.actualDiff):'—'}</b><small>期待 ${fmtES(r.expectedSetting)}</small></div></article>`;return `<section class="workspace analysis-screen"><button class="back-row" type="button" data-workspace="records">‹ 記録</button><div class="kicker">RECORDS</div><h1>収支・期待値</h1><div class="analysis-grid"><div><small>総実戦G</small><b>${formatCount(a.totalG,'G')}</b></div><div><small>勝率</small><b>${Number.isFinite(a.winRate)?a.winRate.toFixed(1)+'%':'—'}</b></div><div><small>実差枚</small><b class="${Number(a.actualDiff)>=0?'plus':'minus'}">${a.actualN?fmtDiff(a.actualDiff):'—'}</b></div><div><small>期待差枚</small><b>${fmtDiff(a.expectedDiff)}</b></div><div><small>実出率</small><b>${Number.isFinite(a.actualRate)?a.actualRate.toFixed(2)+'%':'—'}</b></div><div><small>期待出率</small><b>${Number.isFinite(a.expectedRate)?a.expectedRate.toFixed(2)+'%':'—'}</b></div><div><small>平均期待設定</small><b>${fmtES(a.expectedSetting)}</b></div><div><small>上下振れ</small><b>${a.actualN?fmtDiff((a.actualDiff||0)-(a.expectedDiffActual||0)):'—'}</b></div></div><div class="section-label">機種別</div><div class="analysis-machine-list">${(d.machines||[]).map(r=>card(r,r.name)).join('')||'<div class="empty-card">機種別データなし</div>'}</div><div class="section-label">店舗別</div><div class="analysis-shop-list">${(d.shops||[]).map(r=>card(r,r.name)).join('')||'<div class="empty-card">店舗別データなし</div>'}</div><details class="analysis-cross"><summary>店舗 × 機種</summary><div>${(d.shopMachine||[]).map(r=>card(r,`${r.shopName} / ${r.machineName}`)).join('')||'<div class="empty-card">該当データなし</   renderStrategyScreen(){const f=this.state.strategyFilters,d=this.state.strategyData||this.bridge()?.getStrategyAnalysis?.(f)||{summary:{},filters:{shops:[],machines:[],tags:[]},entryRows:[],tagRows:[],shopTag:[],machineTag:[]};this.state.strategyData=d;const row=(r)=>`<article class="strategy-row"><div><b>${esc(r.label)}</b><small>${r.n}件 / ${formatCount(r.totalG,'G')} / 勝率 ${Number.isFinite(r.winRate)?r.winRate.toFixed(1)+'%':'—'}</small></div><div><b>${r.actualN?fmtDiff(r.actualDiff):'—'}</b><small>期待 ${fmtES(r.expectedSetting)}</small></div></article>`;return `<section class="workspace strategy-screen"><button class="back-row" type="button" data-workspace="records">‹ 記録</button><div class="kicker">RECORDS</div><h1>立ち回り分析</h1><div class="strategy-filters-native"><label><small>区分</small><select data-strategy-entry><option value="">全区分</option><option value="morning" ${f.entry==='morning'?'selected':''}>朝イチ</option><option value="pickup" ${f.entry==='pickup'?'selected':''}>後ヅモ</option></select></label><label><small>店舗</small><select data-strategy-shop><option value="">全店舗</option>${(d.filters?.shops||[]).map(x=>`<option value="${esc(x.id)}" ${f.shopId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label><small>機種</small><select data-strategy-machine><option value="">全機種</option>${(d.filters?.machines||[]).map(x=>`<option value="${esc(x.key)}" ${f.machine===x.key?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label><small>狙い根拠</small><select data-strategy-tag><option value="">全根拠</option>${(d.filters?.tags||[]).map(x=>`<option value="${esc(x.id)}" ${f.tagId===x.id?'selected':''}>${esc(x.name)}${x.active?'':'（過去）'}</option>`).join('')}</select></label></div><div class="analysis-kpis"><div><small>対象稼働</small><b>${formatCount(d.summary?.n,'件')}</b></div><div><small>総実戦G</small><b>${formatCount(d.summary?.totalG,'G')}</b></div><div><small>実差枚</small><b class="${Number(d.summary?.actualDiff)>=0?'plus':'minus'}">${d.summary?.actualN?fmtDiff(d.summary.actualDiff):'—'}</b></div><div><small>期待設定</small><b>${fmtES(d.summary?.expectedSetting)}</b></div></div><div class="section-label">朝イチ / 後ヅモ</div><div class="strategy-list">${(d.entryRows||[]).map(row).join('')||'<div class="empty-card">該当データなし</div>'}</div><div class="section-label">狙い根拠別</div><div class="strategy-list">${(d.tagRows||[]).slice(0,20).map(row).join('')||'<div class="empty-card">タグ付きデータなし</div>'}</div><div class="section-label">店舗 × 狙い根拠</div><div class="strategy-list">${(d.shopTag||[]).slice(0,20).map(row).join('')||'<div class="empty-card">該当データなし</div>'}</div><div class="section-label">機種 × 狙い根拠</div><div class="strategy-list">${(d.machineTag||[]).slice(0,20).map(row).join('')||'<div class="empty-card">該当データなし</div>'}</div></section>`}

  launcherBookmarklet(){return `javascript:(()=>{var s=document.createElement('script');s.src=${JSON.stringify(global.location.origin+'/ana-launcher.js?v=4860')}+'&t='+Date.now();s.onerror=()=>alert('取得ランチャーを読み込めなかったよ');document.documentElement.appendChild(s)})()`}
  renderCollectorScreen(){
    const b=this.bridge(),d=b?.getDataStatus?.()||{targets:[]},busy=this.state.dataBusy,waiting=d.pairState==='pending',key=d.mode==='ios-shortcut'?b?.getCollectorKey?.()||'':'',queue=+d.launcherPending||0;
    return `<section class="workspace data-screen"><button class="back-row" type="button" data-workspace="data">‹ データ</button><div class="kicker">DATA</div><h1>自動取得</h1>
    <section class="panel sync-setup"><h2>${d.linked?'Collector連携済み':waiting?'連携コードの入力待ち':d.pairState==='expired'?'連携コードの期限切れ':d.pairState==='invalid'?'連携を確認できません':'Collector未連携'}</h2>
    <p>端末同期とは別の、取得データをJUGESTへ送るための連携です。</p>
    ${!d.hasReceiver?`<button type="button" class="primary-btn" data-collector-pair ${busy?'disabled':''}>Collector / Launcherと連携する</button><p>6桁コードを発行し、アナスロで開いたLauncherの「設定判別ツール連携」に入力してね。</p><button type="button" class="secondary-btn" data-collector-ios ${busy?'disabled':''}>iPhone Shortcut用キーを発行</button>`:''}
    ${d.mode!=='ios-shortcut'?`<details><summary>Launcherの初回設定</summary><p>Safariでこのページをブックマークし、名前を「JUGEST取得」に変更。ブックマークを編集してURLを下の全文に置き換えてね。</p><label class="sync-code-box"><small>長押しして全文をコピー</small><textarea readonly rows="4" aria-label="Launcherブックマークレット">${esc(this.launcherBookmarklet())}</textarea></label><p>アナスロの店舗日別ページを開き、そのブックマークを実行。「設定判別ツール連携」に6桁コードを入力し、「連携する」を押してね。取得後はLauncherから送信し、JUGESTで新着データを取り込むよ。</p></details>`:''}
    ${waiting?`<label class="sync-code-box"><small>連携コード（10分間有効）</small><input value="${esc(d.code)}" readonly aria-label="Collector連携コード"></label><p>Collector / Launcherで入力すると、この画面が連携済みに切り替わるよ。</p><button type="button" class="secondary-btn" data-collector-copy>コードをコピー</button>`:''}

  renderStoreManagementScreen(){let rows=this.bridge()?.getCollectorStores?.()||this.bridge()?.getDataStatus?.()?.targets||[],e=this.state.storeEditor,q=String(this.state.storeManageQuery||'').trim().toLocaleLowerCase('ja-JP'),f=this.state.storeManageFilter||'all',sort=this.state.storeManageSort||'name';rows=rows.filter(t=>{if(q&&!String(t.name||'').toLocaleLowerCase('ja-JP').includes(q))return false;if(f==='on')return !!t.registered&&!!t.enabled;if(f==='off')return !!t.registered&&!t.enabled;if(f==='unregistered')return !t.registered;if(f==='error')return !!t.error;return true});rows=[...rows].sort((a,b)=>{if(sort==='unregistered')return Number(a.registered)-Number(b.registered)||String(a.name).localeCompare(String(b.name),'ja');if(sort==='on')return Number(b.enabled)-Number(a.enabled)||String(a.name).localeCompare(String(b.name),'ja');if(sort==='latest')return String(b.latestDate||'').localeCompare(String(a.latestDate||''))||String(a.name).localeCompare(String(b.name),'ja');if(sort==='missing')return (+b.missing||0)-(+a.missing||0)||String(a.name).localeCompare(String(b.name),'ja');return String(a.name).localeCompare(String(b.name),'ja')});return `<section class="workspace data-screen"><button class="back-row" type="button" data-workspace="data">‹ データ</button><div class="kicker">DATA</div><h1>店舗管理</h1><p class="lead">自動取得URLと状態を、店舗ごとに管理。</p><button type="button" class="primary-btn" data-store-add ${this.state.dataBusy?'disabled':''}>取得店舗を追加</button>${!this.bridge()?.getDataStatus?.().linked?'<p>URLを保存するにはCollector連携が必要です。</p><button type="button" class="secondary-btn" data-action="data-collector">Collectorを連携する</button>':''}<div class="store-manage-tools"><input data-store-manage-search type="search" value="${esc(this.state.storeManageQuery)}" placeholder="店舗名で検索"><select data-store-filter><option value="all" ${f==='all'?'selected':''}>すべて</option><option value="on" ${f==='on'?'selected':''}>自動取得ON</option><option value="off" ${f==='off'?'selected':''}>自動取得OFF</option><option value="unregistered" ${f==='unregistered'?'selected':''}>URL未登録</option><option value="error" ${f==='error'?'selected':''}>エラーあり</option></select><select data-store-sort><option value="name" ${sort==='name'?'selected':''}>店舗名</option><option value="unregistered" ${sort==='unregistered'?'selected':''}>URL未登録優先</option><option value="on" ${sort==='on'?'selected':''}>自動取得ON優先</option><option value="latest" ${sort==='latest'?'selected':''}>最終取得日</option><option value="missing" ${sort==='missing'?'selected':''}>欠損日数</option></select></div>${e?`<section class="store-editor panel"><div class="panel-head"><h2>${e.registered?'URLを編集':'URLを登録'}</h2><button type="button" class="text-btn" data-store-cancel>閉じる</button></div>${e.isNew?`<label><small>店舗名</small><input data-store-new-name value="${esc(e.name)}" placeholder="店舗名"></label>`:`<b>${esc(e.name)}</b>`}<label><small>アナスロ店舗日別URL</small><input data-store-url type="url" value="${esc(e.url)}" placeholder="https://ana-slo.com/2026-09-05-...-data/"></label><div class="editor-grid"><label><small>取得開始日</small><input data-store-start type="date" value="${esc(e.startDate)}"></label><label><small>優先度</small><select data-store-priority><option value="1" ${e.priority==='1'?'selected':''}>低</option><option value="2" ${e.priority==='2'?'selected':''}>通常</option><option value="3" ${e.priority==='3'?'selected':''}>最優先</option></select></label></div><button class="primary-btn" type="button" data-store-save ${this.state.dataBusy?'disabled':''}>${this.state.dataBusy?'保存中…':'保存'}</button></section>`:''}<div class="collector-list">${rows.map(t=>`<article class="collector-row manage-row"><div><b>${esc(t.name)}</b><small>${t.registered?'URL登録済':'URL未登録'}${t.latestDate?` / 最終 ${esc(t.latestDate)}`:''}${t.missing?` / 欠損 ${t.missing}日`:''}</small></div><div class="manage-actions"><span class="store-badge ${t.error?'error':t.registered?'ok':'warning'}">${t.error?'エラー':t.registered?(t.enabled?'取得ON':'取得OFF'):'未登録'}</span><button type="button" data-store-edit="${esc(t.name)}">${t.registered?'編集':'登録'}</button>${t.registered&&t.latestDate?`<button type="button" data-store-requeue="${esc(t.name)}">最新を再取得</button>`:''}${t.registered?`<button type="button" class="danger-text" data-store-delete="${esc(t.name)}">対象から外す</button>`:''}${t.canDeleteMaster?`<button type="button" class="danger-text store-master-delete" data-store-master-delete="${esc(t.shopId)}" data-store-master-name="${esc(t.name)}">店舗を削除</button>`:''}</div></article>`).join('')||'<div class="empty-card">該当する店舗がないよ。</div>'}</div></section>`}

  renderJsonImportScreen(){const p=this.state.jsonPreview,s=p?.summary;return `<section class="workspace data-screen json-import-screen"><button class="back-row" type="button" data-workspace="data">‹ データ</button><div class="kicker">DATA</div><h1>JSON取込</h1><p class="lead">保存前に内容を必ず確認。既存の正規化・重複判定・保存処理をそのまま使う。</p><label class="json-box"><small>JSON</small><textarea data-json-raw rows="10" placeholder="ここにJSONを貼り付け">${esc(this.state.jsonRaw)}</textarea></label><div class="json-actions"><button type="button" class="secondary-btn" data-json-clear>クリア</button><button type="button" class="primary-btn" data-json-preview ${this.state.jsonBusy?'disabled':''}>${this.state.jsonBusy?'確認中…':'内容を確認'}</button></div>${p?.error?`<div class="error-panel">${esc(p.error)}</div>`:s?`<section class="panel import-preview" data-json-preview><div class="panel-head"><h2>${esc(s.shop||'取込データ')}</h2><span class="status-pill ${s.duplicates?'warning':'success'}">${s.duplicates?`重複 ${s.duplicates}`:'新規'}</span></div>${s.bulk?`<div class="analysis-kpis"><div><small>期間</small><b>${esc(s.from)}〜${esc(s.to)}</b></div><div><small>日数</small><b>${s.days}日</b></div><div><small>台数</small><b>${formatCount(s.machines,'台')}</b></div><div><small>失敗日</small><b>${s.failed||0}日</b></div></div>`:`<div class="analysis-kpis"><div><small>日付</small><b>${esc(s.date||'—')}</b></div><div><small>台数</small><b>${formatCount(s.machines,'台')}</b></div></div>`}<button type="button" class="primary-btn wide-btn" data-json-save ${this.state.jsonBusy?'disabled':''}>この内容を保存</button></section>`:'<div class="info-card"><b>まだ保存されない</b><span>「内容を確認」を押すと、店舗・日付・台数・重複を確認できる。</span></div>'}</section>`}

  renderSyncScreen(){const b=this.bridge(),st=b?.getSyncStatus?.()||{},linked=!!st.link,summary=st.lastSummary||{},code=linked?(b?.getSyncCode?.()||this.state.syncCode||''):(this.state.syncCode||''),last=st.lastSyncAt?new Date(st.lastSyncAt).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'未同期';return `<section class="workspace data-screen sync-screen"><button class="back-row" type="button" data-workspace="data">‹ データ</button><div class="kicker">DATA</div><h1>端末同期</h1><div class="sync-status panel"><div class="panel-head"><div><small>状態</small><h2>${linked?'連携中':'未連携'}</h2></div><span class="status-pill ${linked?'success':'warning'}">${linked?'CONNECTED':'LOCAL'}</span></div><p>${linked?`最終同期 ${esc(last)} / 稼働 ${formatCount(summary.sessions,'件')} / 店舗日 ${formatCount(summary.externalDays,'日')} / 解析 ${formatCount(summary.analysis,'件')}`:'iPhoneや別端末と、稼働記録・店舗データ・タグ・予測実績・解析履歴を暗号化して共有できる。'}</p></div>${linked?`<div class="sync-actions"><button type="button" class="primary-btn" data-sync-now ${this.state.syncBusy?'disabled':''}>${this.state.syncBusy?'同期中…':'今すぐ同期'}</button><button type="button" class="secondary-btn" data-sync-copy>共有コードをコピー</button><button type="button" class="secondary-btn danger-text" data-sync-unlink ${this.state.syncBusy?'disabled':''}>この端末の連携解除</button></div><label class="sync-code-box"><small>共有コード</small><textarea data-sync-code rows="4" readonly>${esc(code)}</textarea></label>`:`<section class="panel sync-setup"><b>新しく共有を始める</b><span>この端末で共有を作成し、表示されたコードをもう片方の端末へ貼り付ける。</span><button type="button" class="primary-btn" data-sync-create ${this.state.syncBusy?'disabled':''}>共有コードを作成</button></section><section class="panel sync-setup"><b>既存の共有へ参加</b><span>もう片方の端末で作った共有コードを貼り付ける。</span><textarea data-sync-code rows="5" placeholder="共有コードを貼り付け">${esc(code)}</textarea><button type="button" class="primary-btn" data-sync-join ${this.state.syncBusy?'disabled':''}>この共有へ参加</button></section>`}${this.state.syncMessage?`<div class="info-card sync-message"><b>${this.state.syncBusy?'処理中':'端末同期'}</b><span>${esc(this.state.syncMessage)}</span></div>`:''}</section>`}
  renderBackupScreen(){const canUndo=!!this.bridge()?.canUndoRestore?.();return `<section class="workspace data-screen"><button class="back-row" type="button" data-workspace="data">‹ データ</button><div class="kicker">DATA</div><h1>バックアップ</h1><div class="backup-card"><b>JUGEST完全バックアップ</b><span>判別データ、稼働記録、店舗データ、予測履歴などをまとめて保存。</span><button type="button" data-backup-save ${this.state.dataBusy?'disabled':''}>${this.state.dataBusy?'処理中…':'バックアップを保存'}</button><button type="button" class="secondary" data-backup-restore ${this.state.dataBusy?'disabled':''}>バックアップから復元</button><button type="button" class="secondary" data-backup-undo ${this.state.dataBusy||!canUndo?'disabled':''}>通常データを復元前に戻す</button><input data-backup-file type="file" accept="application/json,.json" hidden></div><div class="info-card"><b>復元の安全策</b><span>通常データは復元直前の1世代を端末内に退避します。この操作で店舗データと解析履歴は戻りません。すべて戻すには、復元前に保存した完全バックアップを使ってね。</span></div></section>`}


  renderPlanCandidates(rows=[]){return rows.map((r,i)=>`<article class="intel-candidate"><span class="rank">${i+1}</span><div class="intel-candidate-main"><b>${esc(r.tableNo)}番 ${esc(r.machineName)}</b><small>狙い ${Math.round(r.aimScore||0)} / ${r.shortHistory?'P4+目安':'厳格P4+'} ${Number.isFinite(r.predP4)?pct(r.predP4):'—'} / 期待 ${fmtES(r.predES)}</small>${r.evidence?.length?`<details><summary>根拠 ${r.rootFamilyCount||0}系統</summary>${r.evidence.map(e=>`<span>${esc(e.label)} / 信 ${Math.round(e.confidence||0)}</span>`).join('')}</details>`:''}</div><div class="intel-candidate-score"><b>${Math.round(r.aimScore||0)}</b><small>${Math.round((r.rootConfidence||0)*100)}%</small></div></article>`).join('')||'<div class="empty-card">候補を出せる根拠がまだないよ。</div>'}
  renderTodayPlanScreen(){const name=this.state.activeStore||'',r=this.state.planResult;return `<section class="workspace intelligence-screen"><button class="back-row" type="button" data-workspace="store">‹ 店舗</button><div class="kicker">STORE / PLAN</div><button class="store-title compact" type="button" data-open-store-selector><span>${esc(name||'店舗を選択')}</span><span class="store-down">⌄</span></button>${this.renderStoreTabs('plan')}<div class="plan-mode-switch" role="group" aria-label="予測の方式">${Object.entries(PLAN_MODES).map(([key,label])=>`<button type="button" data-plan-mode="${key}" class="${this.state.planMode===key?'selected':''}" aria-pressed="${this.state.planMode===key}">${label}</button>`).join('')}</div><div class="intel-controls plan-controls"><label><small>対象日</small><input type="date" data-plan-date value="${esc(this.state.planDate)}"></label><label><small>抽選番号</small><input type="number" inputmode="numeric" min="0" data-plan-lottery value="${esc(this.state.planLottery)}" placeholder="任意"></label><label><small>並び人数</small><input type="number" inputmode="numeric" min="0" data-plan-queue value="${esc(this.state.planQueue)}" placeholder="任意"></label><button type="button" data-plan-run ${this.state.planLoading?'disabled':''}>${this.state.planLoading?'計算中…':'作戦を計算'}</button></div><p class="plan-mode-label">予測方式：${this.state.planMode==='legacy'?'旧版':'新版'}</p>${this.state.planMode==='new'?'<p class="micro-note">新版の学習済み予測が利用できない場合は、旧版の結果を表示します。</p>':''}${this.state.planMode==='legacy'&&r?.shortHistory?`<p class="micro-note">短期履歴モード：過去${Math.round(r.trainingDays||0)}営業日。45日未満なので信頼度を抑えて順位付けしています。</p>`:''}${r?.error?`<div class="error-panel">${esc(r.error)}</div>`:''}${r&&!r.error?(!r.available?`<div class="empty-card">${this.state.planMode==='legacy'&&r?.minimumDays?`旧版予測には過去${r.minimumDays}営業日以上のデータが必要だよ。現在${Math.round(r.trainingDays||0)}日。`:'この日を予測できる学習データがまだないよ。'}</div>`:`<section class="intel-hero panel"><div><small>${r.go?'今日の第一候補':'今日は慎重寄り'}</small><stron   renderStoreAnalysisScreen(){const name=this.state.activeStore||'',o=this.state.analysisOpts,r=analysisJob.shop===name?analysisJob.result:this.state.analysisResult;return `<section class="workspace intelligence-screen"><button class="back-row" type="button" data-workspace="store">‹ 店舗</button><div class="kicker">STORE / ANALYSIS</div><button class="store-title compact" type="button" data-open-store-selector><span>${esc(name||'店舗を選択')}</span><span class="store-down">⌄</span></button><div class="intel-controls analysis-controls"><div class="analysis-vps-contract"><small>VPS自動解析</small><b>180日 / 2000G / 単一 / 最低4日</b><span>取得済み店舗データをVPSで自動整理・解析</span></div><button type="button" data-analysis-run ${this.state.analysisLoading?'disabled':''}>${this.state.analysisLoading?'取得中…':'VPS解析結果を更新'}</button></div>${this.state.analysisLoading?`<div class="loading-card"><b>${esc(analysisJob.shop)} · ${analysisJob.progress}%</b><progress max="100" value="${analysisJob.progress}" aria-label="店舗解析の進捗"></progress><small>${esc(analysisJob.stage)}。他のタブへ移動できます。</small></div>`:''}${r?.error?`<div class="error-panel">${esc(r.error)}</div>`:''}${r&&!r.error?`<div class="analysis-kpis"><div><small>対象</small><b>${r.days||0}日</b></div><div><small>台日</small><b>${formatCount(r.rowCount)}</b></div><div><small>平均設定</small><b>${fmtES(r.meanES)}</b></div><div><small>使える根拠</small><b>${r.usableCount||0}</b></div></div><div class="section-label">プラス根拠</div><div class="evidence-list">${(r.positive||[]).slice(0,8).map((e,i)=>`<article class="evidence-row"><span>${i+1}</span><div><b>${esc(e.label)}</b><small>${e.days}日 / ${e.rows}台 ・ 信頼 ${Math.round(e.confidence||0)}</small></div><strong class="plus">${e.practicalEffect>=0?'+':''}${Number(e.practicalEffect||0).toFixed(3)}</strong></article>`).join('')||'<div class="empty-card">安定したプラス根拠はまだないよ。</div>'}</div><details class="intel-details"><summary>機種別配分を見る</summary><div class="machine-dist">${(r.machines||[]).map(x=>`<div><b>${esc(x.machineName)}</b><span>期待 ${fmtES(x.meanES)} / ${x.n}台日</span></div>`).join('')}</div></details>${(r.patterns||[]).length?`<details class="intel-details"><summary>複合パターン ${r.patterns.length}件</summary><div class="pattern-list">${r.patterns.map(x=>`<div><b>${esc(x.label)}</b><span>${esc(x.grade)} / 信 ${Math.round(x.confidence||0)} / 上振れ ${Number(x.forecastEffect||0).toFixed(3)}</span></div>`).join('')}</div></details>`:''}${(r.machinePatterns||[]).length?`<details class="intel-details"><summary>機種別×複合 ${r.machinePatterns.length}件</summary><div class="pattern-list">${r.machinePatterns.map(x=>`<div><b>${esc(x.label)}</b><span>${esc(x.grade)} / 信 ${Math.round(x.confidence||0)}</span></div>`).join('')}</div></details>`:''}${(r.negative||[]).length?`<details class="intel-details"><summary>避け根拠 ${r.negative.length}件</summary><div class="pattern-list">${r.negative.map(x=>`<div><b>${esc(x.label)}</b><span>${Number(x.practicalEffect||0).toFixed(3)} / 信 ${Math.round(x.confidence||0)}</span></div>`).join('')}</div></details>`:''}`:(!this.state.analysisLoading?'<div class="info-card"><b>VPS解析結果を待っています</b><span>ショートカットで送信した店舗データはVPSで自動整理・解析され、完了後ここに表示されます。</span></div>':'')}${this.renderAnalysisHistory()}</section>`}
  renderAnalysisHistory(){const items=this.state.analysisHistory||[],open=this.state.analysisHistoryOpen;const fmtDate=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})};const detail=open?`<section class="panel analysis-history-detail"><div class="panel-head"><div><small>保存スナップショット</small><h2>${esc(open.shop||'店舗解析')}</h2></div><button type="button" class="text-btn" data-analysis-history-close>閉じる</button></div><div class="analysis-kpis"><div><small>対象日</small><b>${open.source?.days||0}日</b></div><div><small>対象台日</small><b>${formatCount(open.source?.rowCount)}</b></div><div><small>平均設定</small><b>${fmtES(open.summary?.meanES)}</b></div><div><small>使える根拠</small><b>${open.summary?.usableCount||0}</b></div></div>${(open.machines||[]).length?`<details class="intel-details" open><summary>機種別</summary><div class="machine-dist">${open.machines.map(x=>`<div><b>${esc(x.machineName||x.machine)}</b><span>期待 ${fmtES(x.meanES)} / ${x.n||0}台日</span></div>`).join('')}</div></details>`:''}<div class="section-label">プラス根拠</div><div class="evidence-list">${(open.positive||[]).slice(0,20).map((e,i)=>`<article class="evidence-row"><span>${i+1}</span><div><b>${esc(e.label||'')}</b><small>${e.days||0}日 / ${e.rows||0}台 ・ 信頼 ${Math.round(e.confidence||0)}</small></div><strong class="plus">${Number(e.practicalEffect||0)>=0?'+':''}${Number(e.practicalEffect||0).toFixed(3)}</strong></article>`).join('')||'<div class="empty-card">なし</div>'}</div>${(open.negative||[]).length?`<details class="intel-details"><summary>避け根拠 ${open.negative.length}件</summary><div class="pattern-list">${open.negative.map(x=>`<div><b>${esc(x.label||'')}</b><span>${Number(x.practicalEffect||0).toFixed(3)} / 信 ${Math.round(x.confidence||0)}</span></div>`).join('')}</div></details>`:''}${(open.patterns||[]).length?`<details class="intel-details"><summary>複合パターン ${open.patterns.length}件</summary><div class="pattern-list">${open.patterns.map(x=>`<div><b>${esc(x.label||'')}</b><span>${esc(x.grade||'')} / 信 ${Math.round(x.confidence||0)}</span></div>`).join('')}</div></details>`:''}${open.forecast?.rows?.length?`<details class="intel-details"><summary>保存済み次回狙い台 ${open.forecast.rows.length}件</summary><div class="pattern-list">${open.forecast.rows.map(x=>`<div><b>${esc(x.tableNo)}番 ${esc(x.machine||'')}</b><span>期待 ${fmtES(x.predES)} / P4+ ${Number.isFinite(x.predP4)?pct(x.predP4):'—'}</span></div>`).join('')}</div></details>`:''}</section>`:'';return `<div class="section-label analysis-history-title">解析履歴</div><div class="analysis-history-list">${this.state.analysisHistoryLoading&&!items.length?'<div class="loading-card"><span></span><b>保存履歴を読み込み中…</b></div>':items.slice(0,30).map(x=>`<article class="analysis-history-row"><div><b>${esc(fmtDate(x.createdAt))}</b><small>${esc(x.source?.from||'—')}〜${esc(x.source?.latest||'—')} / ${x.source?.days||0}日 / 根拠 ${x.summary?.usableCount||0}</small></div><div class="analysis-history-actions"><button type="button" data-analysis-history-open="${esc(x.id)}">見る</button><button type="button" class="danger-text" data-analysis-history-delete="${esc(x.id)}">削除</button></div></article>`).join('')||'<div class="empty-card">この店舗の解析履歴はまだないよ。</div>'}</div>${detail}`}
  renderReplayScreen(){const name=this.state.activeStore||'',dates=this.bridge()?.getStoreDates?.(name,240)||[],r=this.state.replayResult;if(!this.state.replayDate)this.state.replayDate=dates[0]||'';return `<section class="workspace intelligence-screen replay-screen"><button class="back-row" type="button" data-workspace="store">‹ 店舗</button><div class="kicker">STORE / REPLAY</div><button class="store-title compact" type="button" data-open-store-selector><span>${esc(name||'店舗を選択')}</span><span class="store-down">⌄</span></button><div class="replay-control panel"><label><small>再現する日</small><select data-replay-date>${dates.map(d=>`<option value="${esc(d)}" ${d===this.state.replayDate?'selected':''}>${esc(d)}</option>`).join('')}</select></label><button type="button" data-replay-run ${this.state.replayLoading||!this.state.replayDate?'disabled':''}>${this.state.replayLoading?'再現中…':'この朝を再現'}</button></div>${r?.error?`<div class="error-panel">${esc(r.error)}</div>`:''}${r&&!r.error?(!r.available?'<div class="empty-card">この日より前の学習データが足りないよ。</div>':`<div class="analysis-kpis"><div><small>学習</small><b>${r.trainingDays}日</b></div><div><small>Top実測P4+</small><b>${Number.isFinite(r.topActualP4)?pct(r.topActualP4):'—'}</b></div><div><small>店実測P4+</small><b>${Number.isFinite(r.storeActualP4)?pct(r.storeActualP4):'—'}</b></div><div><small>Champion</small><b>${esc(r.championLabel)}</b></div></div><p class="micro-note">${esc(r.trainingFrom)}〜${esc(r.trainingTo)}だけで予測を再構築。対象日の実データは採点にのみ使用。</p><div class="section-label">当時の候補</div><div class="replay-list">${(r.candidates||[]).map(c=>`<article class="replay-row"><span class="rank">${c.rank}</span><div><b>${esc(c.tableNo)}番 ${esc(c.machineName)}</b><small>予測P4+ ${Number.isFinite(c.predP4)?pct(c.predP4):'—'} / 期待 ${fmtES(c.predES)}</small></div><div><b>${c.actual&&Number.isFinite(c.actual.p4)?pct(c.actual.p4):'—'}</b><small>実測P4+</small></div></article>`).join('')}</div>`):'<div class="info-card"><b>過去の朝を再現</b><span>対象日より前のデータだけで当時の予測を作り   renderModelPerformanceScreen(){const name=this.state.activeStore||'',r=this.state.modelResult;const metric=(label,m)=>`<article class="model-metric"><b>${label}</b><span>${m?`${m.days}日 / 期待 ${fmtES(m.meanES)} / P4+ ${Number.isFinite(m.meanP4)?pct(m.meanP4):'—'} / lift ${Number.isFinite(m.p4Ratio)?m.p4Ratio.toFixed(2)+'x':'—'}`:'データなし'}</span></article>`;return `<section class="workspace intelligence-screen"><button class="back-row" type="button" data-workspace="store">‹ 店舗</button><div class="kicker">STORE / MODEL</div><button class="store-title compact" type="button" data-open-store-selector><span>${esc(name||'店舗を選択')}</span><span class="store-down">⌄</span></button><button class="model-run" type="button" data-model-run ${this.state.modelLoading?'disabled':''}>${this.state.modelLoading?'計算中…':'性能を計算'}</button>${r?.error?`<div class="error-panel">${esc(r.error)}</div>`:''}${r&&!r.error?`<div class="analysis-kpis"><div><small>モデル信頼度</small><b>${Math.round(r.trust||0)}</b></div><div><small>採点済み</small><b>${r.scoredDays||0}日</b></div><div><small>最近30日</small><b>${Number.isFinite(r.recent30)?Math.round(r.recent30):'—'}</b></div><div><small>候補率</small><b>${Number.isFinite(r.coverage)?Math.round(r.coverage*100)+'%':'—'}</b></div></div><div class="model-metrics">${metric('Top1',r.metrics?.top1)}${metric('Top5',r.metrics?.top5)}${metric('Top10',r.metrics?.top10)}</div><details class="intel-details"><summary>日別答え合わせ ${r.days?.length||0}件</summary><div class="model-days">${(r.days||[]).map(d=>`<div><b>${esc(d.date)}</b><span>${d.candidates?`日次 ${Number.isFinite(d.dayScore)?Math.round(d.dayScore):'—'} / 候補 ${d.candidates}台`:'候補なし'}</span></div>`).join('')||'<div class="empty-card">まだ答え合わせできる予測がないよ。</div>'}</div></details>`:'<div class="info-card"><b>まだ性能計算していない</b><span>過去に保存した予測と実データの答え合わせは、明示実行した時だけ計算する。</span></div>'}</section>`}

  renderStoreSelector(){const q=this.state.storeQuery.trim().toLocaleLowerCase('ja-JP'),rows=this.state.stores.filter(s=>!q||String(s.name||'').toLocaleLowerCase('ja-JP').includes(q));return `<div class="sheet-layer"><button class="sheet-scrim" type="button" data-close-sheet aria-label="閉じる"></button><section class="sheet" role="dialog" aria-modal="true" aria-label="店舗を切り替える"><div class="sheet-handle"></div><div class="sheet-head"><div><small>STORE</small><h2>店舗を切り替える</h2></div><button type="button" class="close-btn" data-close-sheet>閉じる</button></div><label class="search"><span>⌕</span><input data-store-search type="search" placeholder="店舗名を検索" value="${esc(this.state.storeQuery)}"></label><div class="store-list" data-store-list>${rows.length?rows.map(s=>`<button class="store-row ${s.name===this.state.activeStore?'selected':''}" type="button" data-store-name="${esc(s.name)}"><span class="store-row-main"><b>${esc(s.name)}</b><small>${s.latestDate?`最終 ${esc(s.latestDate)}`:(s.registered?'データ未取得':'URL未登録')}</small></span><span class="store-badge ${s.error?'error':s.registered?'ok':'warning'}">${s.error?'エラー':s.registered?'登録済':'URL未登録'}</span><span class="chev">${s.name===this.state.activeStore?'✓':'›'}</span></button>`).join(''):'<div class="empty">一致する店舗がないよ。</div>'}</div></section></div>`}
