<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Juggler Relay Bridge</title></head><body><script>
(()=>{'use strict';
const API='/api/relay';
const ALLOWED=new Set(['https://ana-slo.com','https://www.ana-slo.com','https://2qt9wrwbj9-web.github.io']);
const safePost=(target,origin,data)=>{try{target&&target.postMessage(data,origin)}catch{}};
window.addEventListener('message',async e=>{
  if(!ALLOWED.has(e.origin)||!e.source)return;
  const d=e.data||{};if(d.type!=='juggler-relay-bridge-call'||!d.id)return;
  const started=Date.now();let status=0,statusText='',text='',json=null;
  try{
    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),20000);
    let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d.body||{}),cache:'no-store',signal:ctl.signal})}finally{clearTimeout(timer)}
    status=r.status;statusText=r.statusText;text=await r.text();try{json=text?JSON.parse(text):null}catch{}
    safePost(e.source,e.origin,{type:'juggler-relay-bridge-result',id:d.id,ok:r.ok&&!!json?.ok,httpStatus:status,httpStatusText:statusText,text:text.slice(0,1000),json,durationMs:Date.now()-started});
  }catch(err){safePost(e.source,e.origin,{type:'juggler-relay-bridge-result',id:d.id,ok:false,httpStatus:status,httpStatusText:statusText,text:text.slice(0,1000),json,errorName:err?.name||'Error',errorMessage:err?.message||String(err),durationMs:Date.now()-started})}
});
try{parent.postMessage({type:'juggler-relay-bridge-ready',version:'4.0.4'},'*')}catch{}
})();
</script></body></html>
