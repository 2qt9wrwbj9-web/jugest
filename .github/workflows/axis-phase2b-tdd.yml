name: Axis Phase2B TDD

on:
  push:
    branches:
      - sol/axis-phase2b-oos-gate

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Gate and walk-forward
        run: node --test tests/axis-phase2b-oos-gate.mjs tests/axis-phase2b-walk-forward.mjs
      - name: Report
        run: node --test tests/axis-phase2b-report.mjs
