name: Apply v4.8.1 evidence alias dedup

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-v481-evidence-alias-dedup.mjs
      - scripts/patch-v481-legacy-regression.mjs
      - .github/workflows/apply-v481-evidence-alias-dedup.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply v4.8.1 patch
        run: node scripts/apply-v481-evidence-alias-dedup.mjs

      - name: Make legacy regression alias-aware
        run: node scripts/patch-v481-legacy-regression.mjs

      - name: Full regression suite
        run: npm test

      - name: Structural checks
        run: |
          cmp -s index.html public/index.html
          git diff --check
          git status --short

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/index.html package.json tests/v470-single-evidence.mjs tests/v481-evidence-alias-dedup.mjs
          if git diff --cached --quiet; then
            echo "No release changes to commit"
            exit 0
          fi
          git commit -m "Release v4.8.1 evidence alias dedup"
          git push
