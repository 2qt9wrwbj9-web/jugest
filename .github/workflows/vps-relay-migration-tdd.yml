name: VPS Relay Migration TDD

on:
  push:
    branches: [sol/vps-relay-migration]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: VPS tests
        working-directory: vps
        run: npm test
