name: PIA API recovery research

on:
  push:
    branches:
      - research/pia-api-recovery
    paths:
      - '.github/workflows/pia-api-recovery.yml'
      - 'research/pia/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download PIA XAPK
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/pia /tmp/pia/extracted /tmp/pia/jadx
          URLS=(
            'https://d.apkpure.net/b/XAPK/jp.co.piagroup.app?version=latest'
            'https://d.apkpure.com/b/XAPK/jp.co.piagroup.app?version=latest'
          )
          ok=0
          for url in "${URLS[@]}"; do
            echo "Trying: $url"
            rm -f /tmp/pia/pia.xapk
            if curl -fL --retry 2 --retry-delay 2 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
              -e 'https://apkpure.net/' \
              --connect-timeout 15 --max-time 180 \
              -o /tmp/pia/pia.xapk "$url"; then
              if unzip -t /tmp/pia/pia.xapk >/dev/null 2>&1; then
                ok=1
                break
              fi
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo 'Could not download a valid XAPK.' >&2
            exit 2
          fi
          file /tmp/pia/pia.xapk
          sha256sum /tmp/pia/pia.xapk
          unzip -q /tmp/pia/pia.xapk -d /tmp/pia/extracted
          find /tmp/pia/extracted -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Install latest JADX
        shell: bash
        run: |
          set -euo pipefail
          asset_url="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest \
            | jq -r '.assets[] | select(.name | test("^jadx-[0-9.]+\\.zip$")) | .browser_download_url' \
            | head -n1)"
          test -n "$asset_url"
          echo "JADX: $asset_url"
          curl -fL -o /tmp/pia/jadx.zip "$asset_url"
          unzip -q /tmp/pia/jadx.zip -d /tmp/pia/jadx-bin
          /tmp/pia/jadx-bin/bin/jadx --version

      - name: Decompile base APK and extract API evidence
        shell: bash
        run: |
          set -u
          BASE_APK="$(find /tmp/pia/extracted -type f \( -name 'base.apk' -o -name '*base*.apk' \) -print -quit 2>/dev/null || true)"
          if [ -z "$BASE_APK" ]; then
            BASE_APK="$(find /tmp/pia/extracted -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          fi
          test -n "$BASE_APK"
          echo "Base APK: $BASE_APK"
          /tmp/pia/jadx-bin/bin/jadx -d /tmp/pia/jadx "$BASE_APK" >/tmp/pia/jadx.log 2>&1 || true

          OUT="$GITHUB_WORKSPACE/pia-api-recovery-report.txt"
          : > "$OUT"
          {
            echo 'PIA API recovery report'
            echo "Generated: $(date -u +%FT%TZ)"
            echo "APK: $BASE_APK"
            echo
            echo '=== raw APK strings ==='
            strings "$BASE_APK" | grep -Ei 'pia-server\.heuron\.net|GetStoreMachine|getStoreMachine|encodedData|AFTER DECRYPT GET MACHINE|3des|DESede|TripleDES|store_machine_id' | head -n 600 || true
            echo
            echo '=== decompiled manifest / URLs / API names ==='
            grep -RIna -E 'pia-server\.heuron\.net|GetStoreMachine|getStoreMachine|encodedData|AFTER DECRYPT GET MACHINE|3des|DESede|TripleDES|difference|store_machine_id' /tmp/pia/jadx 2>/dev/null | head -n 1600 || true
            echo
            echo '=== source context for individual machine endpoint ==='
          } >> "$OUT"

          mapfile -t MATCH_FILES < <(grep -RIl -E 'GetStoreMachineContainAllDetail|AFTER DECRYPT GET MACHINE|encodedData|DESede|3des' /tmp/pia/jadx 2>/dev/null | head -n 120 || true)
          for f in "${MATCH_FILES[@]}"; do
            {
              echo
              echo "--- FILE: $f ---"
              grep -n -C 24 -E 'GetStoreMachineContainAllDetail|AFTER DECRYPT GET MACHINE|encodedData|DESede|3des|pia-server\.heuron\.net|getStoreMachine' "$f" || true
            } >> "$OUT"
          done

          {
            echo
            echo '=== likely API declarations / Retrofit annotations ==='
            grep -RIna -C 10 -E '@(POST|GET)|GetStoreMachineContainAllDetail|getStoreMachine2|getStoreMachineChart' /tmp/pia/jadx/sources 2>/dev/null | head -n 1600 || true
            echo
            echo '=== crypto declarations ==='
            grep -RIna -C 18 -E 'Cipher\.getInstance|SecretKeySpec|DESede|3DES|TripleDES|Base64\.(encode|decode)|encodedData' /tmp/pia/jadx/sources 2>/dev/null | head -n 1600 || true
            echo
            echo '=== JADX log tail ==='
            tail -n 120 /tmp/pia/jadx.log || true
          } >> "$OUT"

          mkdir -p "$GITHUB_WORKSPACE/research/pia"
          cp "$OUT" "$GITHUB_WORKSPACE/research/pia/pia-api-recovery-report.txt"
          wc -l "$OUT"
          sed -n '1,320p' "$OUT" || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pia-api-recovery-report
          path: pia-api-recovery-report.txt
          if-no-files-found: warn
          retention-days: 7
