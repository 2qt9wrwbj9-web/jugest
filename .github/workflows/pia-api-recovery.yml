name: PIA API recovery research

on:
  push:
    branches:
      - research/pia-api-recovery
    paths:
      - '.github/workflows/pia-api-recovery.yml'
      - 'research/pia/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download and unpack PIA XAPK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pia/extracted /tmp/pia/base /tmp/pia/arm64 /tmp/pia/out
          URL='https://d.apkpure.net/b/XAPK/jp.co.piagroup.app?version=latest'
          curl -fL --retry 2 --retry-delay 2 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -e 'https://apkpure.net/' --connect-timeout 15 --max-time 180 \
            -o /tmp/pia/pia.xapk "$URL"
          unzip -t /tmp/pia/pia.xapk >/dev/null
          sha256sum /tmp/pia/pia.xapk
          unzip -q /tmp/pia/pia.xapk -d /tmp/pia/extracted
          BASE_APK='/tmp/pia/extracted/jp.co.piagroup.app.apk'
          ARM_APK='/tmp/pia/extracted/config.arm64_v8a.apk'
          test -f "$BASE_APK"
          test -f "$ARM_APK"
          unzip -q "$BASE_APK" -d /tmp/pia/base
          unzip -q "$ARM_APK" -d /tmp/pia/arm64
          META="$(find /tmp/pia/base -path '*/Managed/Metadata/global-metadata.dat' -print -quit)"
          LIB="$(find /tmp/pia/arm64 -name 'libil2cpp.so' -print -quit)"
          test -n "$META"
          test -n "$LIB"
          echo "META=$META" >> "$GITHUB_ENV"
          echo "LIB=$LIB" >> "$GITHUB_ENV"
          ls -lh "$BASE_APK" "$ARM_APK" "$META" "$LIB"
          file "$LIB" "$META"
          xxd -l 32 "$META"
          sha256sum "$LIB"

      - name: Install IL2CPP dumper
        shell: bash
        run: |
          set -euo pipefail
          cargo install il2cpp_dumper --version 0.7.0 --locked
          il2cpp_dumper --version || true

      - name: Dump and preserve targeted native evidence
        shell: bash
        run: |
          set -u
          cat >/tmp/pia/config.json <<'JSON'
          {
            "dumpMethod": true,
            "dumpField": true,
            "dumpProperty": true,
            "dumpAttribute": true,
            "dumpMethodOffset": true,
            "dumpFieldOffset": true,
            "dumpTypeDefIndex": true,
            "dumpAssemblyName": true,
            "splitDumpPerType": true,
            "generateStruct": true,
            "generateDummyDll": false,
            "requireAnyKey": false,
            "dumpDisassembly": true,
            "dumpDisassemblyTarget": 0,
            "dumpDisassemblyHexBytes": false,
            "dumpDisassemblyFieldNames": true,
            "dumpDisassemblyAnnotations": true,
            "dumpDisassemblyCfg": true,
            "maxDisassemblyInstructions": 650,
            "generateCppScaffold": false,
            "dumpStaticFieldMetadata": false
          }
          JSON

          set +e
          il2cpp_dumper --config /tmp/pia/config.json "$LIB" "$META" /tmp/pia/il2cpp-out \
            > /tmp/pia/il2cpp-dumper.log 2>&1
          DUMP_RC=$?
          set -e
          ROOT='/tmp/pia/il2cpp-out/Dump0'
          echo "IL2CPP_DUMPER_RC=$DUMP_RC"
          test -d "$ROOT"

          EVID="$GITHUB_WORKSPACE/pia-il2cpp-evidence"
          mkdir -p "$EVID/sources"
          cp /tmp/pia/il2cpp-dumper.log "$EVID/dumper.log"
          cp "$ROOT/script.json" "$EVID/" 2>/dev/null || true
          cp "$ROOT/stringliteral.json" "$EVID/" 2>/dev/null || true
          cp "$ROOT/dump.cs" "$EVID/" 2>/dev/null || true

          for rel in \
            'DiffableCs/Assembly-CSharp/UnitDataController.cs' \
            'DiffableCs/Assembly-CSharp/PIA/UnitData__List.cs' \
            'DiffableCs/Assembly-CSharp/PIA/UnitData__Detail.cs' \
            'DiffableCs/Assembly-CSharp/SaveDataManager.cs' \
            'DiffableCs/Assembly-CSharp/Model/EncyptData.cs'; do
            src="$ROOT/$rel"
            if [ -f "$src" ]; then
              dst="$EVID/sources/${rel//\//__}"
              cp "$src" "$dst"
            fi
          done

          grep -RIl -E 'GetStoreMachineContainAllDetail|AFTER DECRYPT GET MACHINE|encodedData|StringLiteral_3des|"3des"' \
            "$ROOT/DiffableCs/Assembly-CSharp" 2>/dev/null | head -n 80 > /tmp/pia/target-files.txt || true
          while IFS= read -r src; do
            [ -f "$src" ] || continue
            rel="${src#$ROOT/}"
            dst="$EVID/sources/${rel//\//__}"
            cp "$src" "$dst" 2>/dev/null || true
          done < /tmp/pia/target-files.txt

          REPORT="$EVID/target-report.txt"
          {
            echo 'PIA IL2CPP focused report'
            echo "Generated: $(date -u +%FT%TZ)"
            echo "Dumper exit: $DUMP_RC"
            echo
            echo '=== exact method declaration + body context ==='
            grep -n -A 760 -B 60 -F 'GetStoreMachineContainAllDetail' "$ROOT/DiffableCs/Assembly-CSharp/UnitDataController.cs" | head -n 900 || true
            echo
            echo '=== GetStoreMachine body context ==='
            grep -n -A 650 -B 40 -E 'GetStoreMachine\(' "$ROOT/DiffableCs/Assembly-CSharp/UnitDataController.cs" | head -n 780 || true
            echo
            echo '=== target call sites ==='
            grep -RIna -C 70 -F 'GetStoreMachineContainAllDetail' "$ROOT/DiffableCs/Assembly-CSharp/PIA" | head -n 1200 || true
            echo
            echo '=== encodedData / 3des / decrypt-log references in Assembly-CSharp ==='
            grep -RIna -C 90 -E 'encodedData|StringLiteral_3des|"3des"|AFTER DECRYPT GET MACHINE|TripleDES|Encrypt|Decrypt' "$ROOT/DiffableCs/Assembly-CSharp" | head -n 5000 || true
            echo
            echo '=== relevant literal entries ==='
            grep -n -C 4 -Ei 'encodedData|3des|AFTER DECRYPT GET MACHINE|getStoreMachine2|getStoreMachineChart|pia-server\.heuron\.net' "$ROOT/stringliteral.json" | head -n 1600 || true
          } > "$REPORT"

          echo '=== preserved sources ==='
          find "$EVID" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          echo '=== focused report preview ==='
          sed -n '1,520p' "$REPORT" || true

      - name: Upload IL2CPP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pia-il2cpp-evidence
          path: pia-il2cpp-evidence
          if-no-files-found: warn
          retention-days: 7
