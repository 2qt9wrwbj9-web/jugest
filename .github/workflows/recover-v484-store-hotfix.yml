name: Recover v4.8.4 store registration hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-v484-store-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Recover and apply reviewed patch
        shell: bash
        run: |
          sed -n "/<<'PATCH'/,/^PATCH$/p" .github/workflows/apply-v484-store-hotfix.yml | sed '1d;$d' > /tmp/hotfix.patch.gz.b64
          test -s /tmp/hotfix.patch.gz.b64
          base64 -d /tmp/hotfix.patch.gz.b64 | gunzip > /tmp/hotfix.patch
          git apply --check /tmp/hotfix.patch
          git apply /tmp/hotfix.patch
      - run: npm ci
      - run: npm test
      - name: Commit tested hotfix and clean temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply-v484-store-hotfix.yml .github/workflows/recover-v484-store-hotfix.yml
          git config user.name "Hiro"
          git config user.email "2qt9wrwbj9@privaterelay.appleid.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix v4.8.4 store registration"
          git push
