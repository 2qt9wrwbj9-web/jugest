name: Axis Phase2A Verify

on:
  push:
    branches:
      - sol/axis-phase2a-walk-forward
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Phase 2A focused tests
        run: |
          node --test \
            tests/axis-phase2a-builder.mjs \
            tests/axis-phase2a-input.mjs \
            tests/axis-phase2a-walk-forward.mjs
