name: Export Phase2B Source

on:
  push:
    branches:
      - sol/axis-phase2b-oos-gate

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect exact research source
        run: |
          mkdir -p phase2b-source/research phase2b-source/scripts
          cp index.html hanahana-judge.js missing-inference.js core-v510.js sync-core.js package.json phase2b-source/
          cp -R research/axis-auto-selector phase2b-source/research/
          cp research/store-optimization.mjs phase2b-source/research/
          cp scripts/axis-auto-selector-benchmark.mjs scripts/axis-auto-selector.mjs scripts/axis-historical-bundle.mjs scripts/axis-phase2a.mjs scripts/axis-walk-forward-backtest.mjs phase2b-source/scripts/
      - uses: actions/upload-artifact@v4
        with:
          name: phase2b-source
          path: phase2b-source
          if-no-files-found: error
