name: Apply v4.8.3 storage meter

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-v483-storage-meter.mjs
      - .github/workflows/apply-v483-storage-meter.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Apply patch
        run: node scripts/patch-v483-storage-meter.mjs
      - name: Run full regression suite
        run: npm test
      - name: Commit generated release
        run: |
          git config user.name "Hiro"
          git config user.email "2qt9wrwbj9@privaterelay.appleid.com"
          git add -A
          git commit -m "Release v4.8.3 analysis history storage meter"
          git push
