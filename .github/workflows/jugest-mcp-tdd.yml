name: JUGEST MCP TDD

on:
  push:
    branches:
      - feat/jugest-chatgpt-mcp
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install VPS dependencies
        working-directory: vps
        run: npm ci --no-audit --no-fund
      - name: Run VPS tests
        working-directory: vps
        run: npm test
