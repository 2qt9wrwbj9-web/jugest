name: Bump v4.8.5 numbering only
on:
  push:
    paths:
      - '.github/workflows/bump-v485.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Change numbering only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in files:
              if not name:
                  continue
              if name.startswith('README_V4') or name.startswith('VALIDATION_v4'):
                  continue
              p = Path(name)
              try:
                  s = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              n = s.replace('4.8.4', '4.8.5').replace('4840', '4850').replace(r'4\.8\.4', r'4\.8\.5')
              if n != s:
                  p.write_text(n, encoding='utf-8')
          PY

          if [ -f BOOKMARKLET_v4840.txt ]; then git mv BOOKMARKLET_v4840.txt BOOKMARKLET_v4850.txt; fi
          if [ -f public/BOOKMARKLET_v4840.txt ]; then git mv public/BOOKMARKLET_v4840.txt public/BOOKMARKLET_v4850.txt; fi
          if [ -f .github/workflows/build-v484-netlify-package.yml ]; then
            git mv .github/workflows/build-v484-netlify-package.yml .github/workflows/build-v485-netlify-package.yml
            python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-v485-netlify-package.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('build-v484-netlify-package.yml', 'build-v485-netlify-package.yml')
          p.write_text(s, encoding='utf-8')
          PY
          fi

          npm ci
          npm test
          git diff --check

      - name: Build Netlify Drop ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f jugglerest_netlify_v4850_deploy.zip
          zip -r jugglerest_netlify_v4850_deploy.zip . \
            -x '.git/*' \
            -x '.github/workflows/bump-v485.yml' \
            -x 'node_modules/*' \
            -x 'jugglerest_netlify_v4850_deploy.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: jugglerest_netlify_v4850_deploy
          path: jugglerest_netlify_v4850_deploy.zip
          if-no-files-found: error
          retention-days: 7

      - name: Commit v4.8.5 numbering
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bump-v485.yml
          git config user.name 'Hiro'
          git config user.email '2qt9wrwbj9@privaterelay.appleid.com'
          git add -A
          git commit -m 'Bump release numbering to v4.8.5'
          git push
