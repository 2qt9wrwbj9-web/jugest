name: PIA Isezaki probe

on:
  push:
    branches:
      - 'investigation/pia-api-recovery-20260917'
    paths:
      - '.github/workflows/pia-isezaki-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe RankingTop machine filters
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request

          url='https://piagroupapp.com/api/stores/getRankingTop'
          cases=[
            ('base', {'machine_type':'S','store_id':'11','limit':'1000'}),
            ('code', {'machine_type':'S','store_id':'11','limit':'1000','sis_machine_code':'99119996'}),
            ('machine_no', {'machine_type':'S','store_id':'11','limit':'1000','machine_no':'3240'}),
            ('both', {'machine_type':'S','store_id':'11','limit':'1000','sis_machine_code':'99119996','machine_no':'3240'}),
          ]
          for label,payload in cases:
              data=urllib.parse.urlencode(payload).encode()
              req=urllib.request.Request(url,data=data,headers={'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      obj=json.loads(r.read().decode('utf-8','replace'))
                      rows=obj.get('ranking',[]) if isinstance(obj,dict) else []
                      nos=sorted({str(x.get('machine_no')) for x in rows if isinstance(x,dict)})
                      codes=sorted({str(x.get('sis_machine_code')) for x in rows if isinstance(x,dict)})
                      names=sorted({str(x.get('name')) for x in rows if isinstance(x,dict)})
                      print(label,'status=',obj.get('status'),'rows=',len(rows),'machine_count=',len(nos),'code_count=',len(codes))
                      print('nos=',nos[:25])
                      print('codes=',codes[:15])
                      print('names=',names[:15])
              except Exception as e:
                  print(label,'ERROR',repr(e))
          PY
