name: PIA Isezaki API Probe

on:
  push:
    branches:
      - investigation/pia-isezaki-probe-20260923
    paths:
      - .github/workflows/pia-isezaki-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect PIA target store objects
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          BASE='https://pia-server.heuron.net'
          def post(path,data):
              body=urllib.parse.urlencode(data).encode()
              req=urllib.request.Request(BASE+path,data=body,method='POST',headers={'Content-Type':'application/x-www-form-urlencoded','Accept':'application/json','User-Agent':'Mozilla/5.0 PIA-public-probe'})
              with urllib.request.urlopen(req,timeout=15) as r:
                  return json.loads(r.read().decode('utf-8','replace'))
          obj=post('/api/stores/getAllStores',{})
          stores=obj.get('stores',[]) if isinstance(obj,dict) else []
          print('STORE_COUNT',len(stores))
          if stores: print('FIRST_STORE_KEYS',list(stores[0].keys()) if isinstance(stores[0],dict) else type(stores[0]).__name__)
          for s in stores:
              txt=json.dumps(s,ensure_ascii=False)
              if '伊勢佐木' in txt or '大船' in txt:
                  print('TARGET_STORE',txt[:20000])
          PY
