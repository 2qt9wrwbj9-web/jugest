name: PIA Isezaki API Probe

on:
  push:
    branches:
      - investigation/pia-isezaki-probe-20260923
    paths:
      - .github/workflows/pia-isezaki-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe PIA ranking filters
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error, itertools
          BASE='https://pia-server.heuron.net'
          PATH='/api/stores/getRankingTop'

          def post(data):
              body=urllib.parse.urlencode(data).encode()
              req=urllib.request.Request(BASE+PATH,data=body,method='POST',headers={
                  'Content-Type':'application/x-www-form-urlencoded',
                  'Accept':'application/json',
                  'User-Agent':'Mozilla/5.0 PIA-public-probe'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      raw=r.read(); code=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read(); code=e.code
              try: obj=json.loads(raw.decode('utf-8','replace'))
              except Exception: obj=None
              return code,obj

          def ranklen(obj):
              return len(obj.get('ranking',[])) if isinstance(obj,dict) and isinstance(obj.get('ranking'),list) else -1

          print('=== FILTER GRID store 35 ===')
          candidates=[]
          for price,kind,mt in itertools.product(('',0,5,20,46),(0,1,2,3),('',0,1,2,3)):
              d={'user_code':'','price':price,'kind':kind,'machine_type':mt,'day':0,'store_id':35,'limit':5000}
              code,obj=post(d); n=ranklen(obj); status=obj.get('status') if isinstance(obj,dict) else None
              if code==200 and status in (0,'0'):
                  print('GRID',json.dumps(d,ensure_ascii=False),'LEN',n)
                  candidates.append((n,d))
                  if n==3210:
                      print('EXACT_3210',json.dumps(d,ensure_ascii=False)); break
          else:
              pass

          exact=next((d for n,d in candidates if n==3210),None)
          if exact is None and candidates:
              # Prefer a 30-row-per-machine looking result, then the largest non-capped result.
              good=[(n,d) for n,d in candidates if n>0 and n<5000 and n%30==0]
              if good: exact=max(good,key=lambda x:x[0])[1]
              else:
                  noncap=[(n,d) for n,d in candidates if n>0 and n<5000]
                  exact=max(noncap,key=lambda x:x[0])[1] if noncap else max(candidates,key=lambda x:x[0])[1]
          print('CHOSEN',json.dumps(exact,ensure_ascii=False) if exact else 'NONE')

          if exact:
              print('=== SAME FILTER ON 35/11/12 ===')
              for sid in (35,11,12):
                  d=dict(exact); d['store_id']=sid
                  code,obj=post(d); n=ranklen(obj)
                  ranking=obj.get('ranking',[]) if isinstance(obj,dict) else []
                  uniq=len({r.get('machine_no') for r in ranking if isinstance(r,dict) and r.get('machine_no') is not None})
                  names=[]
                  for r in ranking[:10]:
                      if isinstance(r,dict): names.append(r.get('name'))
                  print('STORE',sid,'HTTP',code,'STATUS',obj.get('status') if isinstance(obj,dict) else None,'LEN',n,'UNIQ',uniq,'SAMPLE_NAMES',json.dumps(names[:5],ensure_ascii=False))

          print('=== MACHINE INVENTORY COUNTS ===')
          mpath='/api/stores/getStoreMachiesWithHowToPlay'
          for sid in (35,11,12):
              body=urllib.parse.urlencode({'store_id':sid}).encode()
              req=urllib.request.Request(BASE+mpath,data=body,method='POST',headers={'Content-Type':'application/x-www-form-urlencoded','User-Agent':'Mozilla/5.0 PIA-public-probe'})
              with urllib.request.urlopen(req,timeout=15) as r: obj=json.loads(r.read().decode())
              slot=obj.get('slot',[]) if isinstance(obj,dict) else []
              pach=obj.get('pachinko',[]) if isinstance(obj,dict) else []
              slot_nos=sum(len(x.get('machine_nos',[])) for x in slot if isinstance(x,dict))
              pach_nos=sum(len(x.get('machine_nos',[])) for x in pach if isinstance(x,dict))
              print('INVENTORY',sid,'SLOT_MODELS',len(slot),'SLOT_MACHINES',slot_nos,'PACH_MODELS',len(pach),'PACH_MACHINES',pach_nos)
          PY
