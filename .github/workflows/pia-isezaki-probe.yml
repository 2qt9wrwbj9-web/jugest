name: PIA Isezaki probe

on:
  push:
    branches:
      - 'investigation/pia-api-recovery-20260917'
    paths:
      - '.github/workflows/pia-isezaki-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify ranking kind for Ofuna and Isezaki
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request

          url='https://pia-server.heuron.net/api/stores/getRankingTop'
          stores=[(35,'PIA大船'),(11,'PIA伊勢佐木町'),(12,'PIA伊勢佐木3丁目')]

          for kind in ['1','2']:
              print('\n===== kind',kind,'=====')
              for sid,name in stores:
                  payload={
                      'user_code':'',
                      'price':'',
                      'kind':kind,
                      'machine_type':'',
                      'day':'0',
                      'store_id':str(sid),
                      'limit':'5000',
                  }
                  data=urllib.parse.urlencode(payload).encode()
                  req=urllib.request.Request(url,data=data,headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST')
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r:
                          raw=r.read().decode('utf-8','replace')
                          obj=json.loads(raw)
                          rows=obj.get('ranking',[]) if isinstance(obj,dict) else []
                          print(name,'store_id=',sid,'http=',r.status,'status=',obj.get('status'),'count=',len(rows),'bytes=',len(raw))
                          if rows:
                              names=[str(x.get('name')) for x in rows[:10] if isinstance(x,dict)]
                              print('sample_names=',names)
                              sample=rows[0]
                              if isinstance(sample,dict):
                                  print('sample_machine_no=',sample.get('machine_no'),'difference=',sample.get('difference'),'special_1=',sample.get('special_1'),'special_2d=',sample.get('special_2d'),'out=',sample.get('out'),'special_out=',sample.get('special_out'))
                  except Exception as e:
                      print(name,'ERROR',repr(e))
          PY
