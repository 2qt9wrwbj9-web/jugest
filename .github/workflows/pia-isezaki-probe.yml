name: PIA Isezaki API Probe

on:
  push:
    branches:
      - investigation/pia-isezaki-probe-20260923
    paths:
      - .github/workflows/pia-isezaki-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect PIA store metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          BASE='https://pia-server.heuron.net'
          def post(path,data):
              body=urllib.parse.urlencode(data).encode()
              req=urllib.request.Request(BASE+path,data=body,method='POST',headers={'Content-Type':'application/x-www-form-urlencoded','Accept':'application/json','User-Agent':'Mozilla/5.0 PIA-public-probe'})
              with urllib.request.urlopen(req,timeout=15) as r:
                  raw=r.read(); code=r.status
              return code,json.loads(raw.decode('utf-8','replace'))

          code,obj=post('/api/stores/getAllStores',{})
          print('ALLSTORES_HTTP',code,'TOP_KEYS',list(obj) if isinstance(obj,dict) else type(obj).__name__)
          targets={11,12,35}
          def walk(x):
              if isinstance(x,dict):
                  if x.get('store_id') in targets:
                      print('STORE_OBJECT',json.dumps(x,ensure_ascii=False)[:12000])
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(obj)

          for sid in (35,11,12):
              code,m=post('/api/stores/getStoreMachiesWithHowToPlay',{'store_id':sid})
              print('MACHINE_STORE',sid,'TOP_KEYS',list(m.keys()) if isinstance(m,dict) else [])
              slot=m.get('slot',[]) if isinstance(m,dict) else []
              print('SLOT_FIRST',sid,json.dumps(slot[:3],ensure_ascii=False)[:12000])
          PY
