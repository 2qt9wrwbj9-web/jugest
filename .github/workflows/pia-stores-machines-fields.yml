name: PIA stores machines form fields

on:
  push:
    branches: [research/pia-api-recovery]
    paths: ['.github/workflows/pia-stores-machines-fields.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact form field strings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pia/x /tmp/pia/arm64 pia-stores-machines-fields
          curl -fL --retry 2 --retry-delay 2 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -e 'https://apkpure.net/' --connect-timeout 15 --max-time 180 \
            -o /tmp/pia/pia.xapk \
            'https://d.apkpure.net/b/XAPK/jp.co.piagroup.app?version=latest'
          unzip -q /tmp/pia/pia.xapk -d /tmp/pia/x
          unzip -q /tmp/pia/x/config.arm64_v8a.apk -d /tmp/pia/arm64
          LIB="$(find /tmp/pia/arm64 -name libil2cpp.so -print -quit)"
          readelf -rW "$LIB" > /tmp/rel.txt
          {
            echo '=== FDMHENCCLHK getStoresMachines form key slots ==='
            for slot in 2c6a360 2c69c18; do
              grep -i "^0*${slot}[[:space:]]" /tmp/rel.txt || true
            done
          } | tee pia-stores-machines-fields/fields.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pia-stores-machines-fields
          path: pia-stores-machines-fields
          retention-days: 7
