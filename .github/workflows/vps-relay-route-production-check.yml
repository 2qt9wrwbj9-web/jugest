name: VPS Relay Route Production Check

on:
  push:
    branches: [sol/vps-relay-migration]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production relay route
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            health="$(curl -fsS --max-time 10 https://jugest.net/api/health || true)"
            code="$(curl -sS --max-time 10 -o /tmp/relay-body -w '%{http_code}' https://jugest.net/api/relay || true)"
            if printf '%s' "$health" | grep -q '"ok":true' && [ "$code" = 405 ]; then
              cat /tmp/relay-body
              exit 0
            fi
            echo "relay route not live yet: attempt=$attempt code=$code"
            sleep 10
          done
          exit 1
