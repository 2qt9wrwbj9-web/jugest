name: Implement v4.8.7 evidence policy

on:
  push:
    branches:
      - v487-evidence-policy
    paths:
      - .github/workflows/implement-v487-evidence-policy.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix patcher literal replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-v487.py')
          s=p.read_text()
          old="s,n=re.subn(pat,NEW_RANKER+'function bruteSingleCandidateLabel',s,count=1,flags=re.S)"
          new="s,n=re.subn(pat,lambda m: NEW_RANKER+'function bruteSingleCandidateLabel',s,count=1,flags=re.S)"
          if old not in s:
              raise SystemExit('patcher replacement target missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply evidence policy
        run: python3 scripts/apply-v487.py
      - name: Update intentional regression contracts
        run: python3 scripts/update-v487-tests.py
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Test v4.8.7
        run: npm test
      - name: Build Netlify Drop ZIP
        run: |
          rm -f jugglerest_netlify_v4870_deploy.zip
          zip -r jugglerest_netlify_v4870_deploy.zip . -x '.git/*' -x '.github/workflows/implement-v487-evidence-policy.yml' -x 'node_modules/*' -x 'jugglerest_netlify_v4870_deploy.zip'
          sha256sum jugglerest_netlify_v4870_deploy.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jugglerest_netlify_v4870_deploy
          path: jugglerest_netlify_v4870_deploy.zip
          if-no-files-found: error
          retention-days: 7
      - name: Commit tested v4.8.7 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html public/index.html sync-ui.js public/sync-ui.js README.md package.json package-lock.json tests/netlify-deploy-preflight.mjs tests/v486-device-sync.mjs tests/v487-evidence-policy.mjs tests/v460-ranking.mjs tests/v470-single-evidence.mjs tests/v471-performance-regression.mjs tests/v474-lazy-execution.mjs tests/v476-hybrid-ranking.mjs tests/v479-evidence-contribution-ui.mjs tests/v480-jdata-setting-summary.mjs tests/v481-evidence-alias-dedup.mjs tests/v482-analysis-history.mjs tests/v483-storage-meter.mjs scripts/apply-v487.py scripts/update-v487-tests.py
          git diff --cached --quiet && exit 0
          git commit -m 'Release v4.8.7 evidence policy'
          git push origin HEAD:v487-evidence-policy

# trigger after scoped long-recency regression fix
