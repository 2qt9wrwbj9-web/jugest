name: VPS Canonical Ingest TDD

on:
  push:
    branches:
      - sol/vps-canonical-ingest-analysis
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm test
        working-directory: vps
