name: VPS Canonical Ingest TDD

on:
  push:
    branches:
      - sol/vps-canonical-ingest-analysis
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: node scripts/apply-vps-browser-analysis.mjs
      - run: node --test tests/vps-browser-analytics.mjs tests/vps-browser-analysis-static.mjs
      - run: npm test
      - run: npm test
        working-directory: vps
      - name: Commit verified browser patch
        shell: bash
        run: |
          if git diff --quiet -- app-v510.js; then
            echo "browser patch already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v510.js
          git commit -m "feat: read store analysis from VPS snapshots"
          git push origin HEAD:${GITHUB_REF_NAME}
