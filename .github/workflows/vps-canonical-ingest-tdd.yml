name: VPS Canonical Ingest TDD

on:
  push:
    branches:
      - sol/vps-canonical-ingest-analysis
      - 'sol/vps-*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: Verify Task 7 patch is fully committed
        shell: bash
        run: |
          node scripts/apply-vps-browser-analysis.mjs
          git diff --exit-code -- app-v510.js
      - run: node --test tests/vps-browser-analytics.mjs tests/vps-browser-analysis-static.mjs
      - run: npm test
      - run: npm test
        working-directory: vps
