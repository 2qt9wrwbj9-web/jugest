name: Maruhan Android isolated smoke test
on:
  push:
    branches: [experiments/maruhan-android-ci-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maruhan-android-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Prepare isolated app probe
        run: |
          cat > /tmp/maruhan-smoke.py <<'PY'
          import urllib.request, zipfile, os, pathlib, subprocess, json
          u='https://d.apkpure.net/b/XAPK/jp.co.maruhan.android?versionCode=68008&nc=armeabi-v7a&sv=26'
          work=pathlib.Path('/tmp/maruhan-apk');work.mkdir(exist_ok=True)
          p=work/'maruhan.xapk'
          try:
              with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=60) as r:
                  with p.open('wb') as f:
                      while True:
                          c=r.read(1024*1024)
                          if not c:break
                          f.write(c)
                          if f.tell()>75*1024*1024:raise ValueError('archive over limit')
              with zipfile.ZipFile(p) as z:
                  names=[n for n in z.namelist() if n.endswith('.apk') and '..' not in n and n.count('/')==0]
                  print('APK_ARCHIVE:',len(names),'files', [(n,z.getinfo(n).file_size) for n in names])
                  names=[n for n in names if n=='config.armeabi_v7a.apk' or not any(part in n for part in ('arm64','armeabi','x86_64','x86'))]
                  for n in names:(work/n).write_bytes(z.read(n))
              if not names:raise ValueError('no architecture-neutral APK')
              print('INSTALL_ATTEMPT:',names)
              print('GUEST_PROPERTIES:',subprocess.run(['adb','shell','getprop','ro.build.fingerprint'],capture_output=True,text=True,timeout=10).stdout[:110].strip())
              print('GUEST_TZ_BEFORE:',subprocess.run(['adb','shell','getprop','persist.sys.timezone'],capture_output=True,text=True,timeout=10).stdout.strip())
              subprocess.run(['adb','shell','setprop','persist.sys.timezone','Asia/Tokyo'],capture_output=True,text=True,timeout=12)
              print('PLAY_APP:',subprocess.run(['adb','shell','pm','path','com.android.vending'],capture_output=True,text=True,timeout=10).stdout[:140].strip())
              print('GMS_APP:',subprocess.run(['adb','shell','pm','path','com.google.android.gms'],capture_output=True,text=True,timeout=10).stdout[:140].strip())
              subprocess.run(['adb','logcat','-c'],capture_output=True,text=True,timeout=10)
              res=subprocess.run(['adb','install-multiple','-r',*[str(work/n) for n in names]],capture_output=True,text=True,timeout=100)
              print('INSTALL_CODE:',res.returncode,'OUT:',(res.stdout+res.stderr)[-900:])
              if res.returncode==0:
                  pkg='jp.co.maruhan.android'
                  cmd=subprocess.run(['adb','shell','monkey','-p',pkg,'-c','android.intent.category.LAUNCHER','1'],capture_output=True,text=True,timeout=25)
                  print('LAUNCH_CODE:',cmd.returncode,'OUT:',(cmd.stdout+cmd.stderr)[-550:])
                  import time;time.sleep(10)
                  dump=subprocess.run(['adb','shell','dumpsys','activity','activities'],capture_output=True,text=True,timeout=15)
                  lines=[v.strip() for v in dump.stdout.splitlines() if 'mResumed' in v or 'topResumedActivity' in v]
                  print('VISIBLE_ACTIVITY:',lines[:5])
                  logs=subprocess.run(['adb','logcat','-d','-v','brief'],capture_output=True,text=True,timeout=18)
                  needles=('UnsatisfiedLinkError','NoClassDefFoundError','ClassNotFoundException','SSLHandshakeException','UnknownHostException','ConnectException','ApiSec')
                  matched=[k for k in needles if k in logs.stdout]
                  print('DIAGNOSTIC_ERROR_TYPES:',matched)
                  print('LOG_401_COUNT:',logs.stdout.count('401'),'LOG_403_COUNT:',logs.stdout.count('403'))
                  import re
                  pkgpid=subprocess.run(['adb','shell','pidof',pkg],capture_output=True,text=True,timeout=12).stdout.strip().split()
                  if pkgpid:
                      print('APP_PID_PRESENT:',True)
                      applo=subprocess.run(['adb','logcat','-d','-v','brief','--pid='+pkgpid[0]],capture_output=True,text=True,timeout=18)
                      for k in ['401','403','400','500','token','auth','request','response','failed','exception','ssl','API']:
                          print('APPLOG_COUNT_'+k.upper()+':',len(re.findall(re.escape(k),applo.stdout,re.I)))
                  print('TOP_ERRTAGS:',__import__('collections').Counter(re.findall(r'^[EWF]/([^ (:]+)',logs.stdout,re.M)).most_common(18))
                  dump=subprocess.run(['adb','shell','uiautomator','dump','/sdcard/maruhan-ui.xml'],capture_output=True,text=True,timeout=35)
                  print('UI_DUMP_STATUS:',dump.returncode,dump.stdout[-160:],dump.stderr[-160:])
                  if dump.returncode==0:
                      subprocess.run(['adb','pull','/sdcard/maruhan-ui.xml','/tmp/maruhan-firstscreen-ui.xml'],capture_output=True,text=True,timeout=25)
                      import xml.etree.ElementTree as ET
                      root=ET.parse('/tmp/maruhan-firstscreen-ui.xml').getroot()
                      arr=[]
                      for node in root.iter('node'):
                          desc=node.attrib.get('content-desc','').strip()
                          txt=node.attrib.get('text','').strip()
                          if desc or txt:arr.append((txt[:90],desc[:90],node.attrib.get('bounds')))
                      print('INITIAL_VISIBLE_UI_NODES:',arr[:60])
                  shot=subprocess.run(['adb','exec-out','screencap','-p'],capture_output=True,timeout=35)
                  if shot.returncode==0:
                      pathlib.Path('/tmp/maruhan-firstscreen.png').write_bytes(shot.stdout)
                      print('SCREENSHOT_BYTES:',len(shot.stdout))
                  subprocess.run(['adb','shell','input','tap','244','416'],capture_output=True,text=True,timeout=15)
                  time.sleep(22)
                  again=subprocess.run(['adb','shell','uiautomator','dump','/sdcard/maruhan-after.xml'],capture_output=True,text=True,timeout=30)
                  if again.returncode==0:
                      subprocess.run(['adb','pull','/sdcard/maruhan-after.xml','/tmp/maruhan-afterclose-ui.xml'],capture_output=True,text=True,timeout=15)
                      ar=ET.parse('/tmp/maruhan-afterclose-ui.xml').getroot()
                      found=[(n.attrib.get('text','')[:70],n.attrib.get('content-desc','')[:70],n.attrib.get('bounds','')) for n in ar.iter('node') if n.attrib.get('text','') or n.attrib.get('content-desc','')]
                      print('AFTER_DISMISS_UI:',found[:65])
                  shot2=subprocess.run(['adb','exec-out','screencap','-p'],capture_output=True,timeout=20)
                  if shot2.returncode==0:pathlib.Path('/tmp/maruhan-afterclose.png').write_bytes(shot2.stdout)
          except Exception as e:
              print('APP_TEST_ERROR:',type(e).__name__,str(e)[:450])
          PY
      - name: Start Android and verify public app install
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 450
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 /tmp/maruhan-smoke.py
      - name: Upload guest app first-screen evidence (temporary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maruhan-firstscreen-guest
          path: |
            /tmp/maruhan-firstscreen.png
            /tmp/maruhan-firstscreen-ui.xml
            /tmp/maruhan-afterclose.png
            /tmp/maruhan-afterclose-ui.xml
          retention-days: 1
          if-no-files-found: warn
