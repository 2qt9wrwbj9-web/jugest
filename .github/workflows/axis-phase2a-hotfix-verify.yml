name: Axis Phase2A Hotfix Verify

on:
  push:
    branches:
      - sol/axis-phase2a-walk-forward
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Focused Phase2A tests
        run: |
          node --test tests/axis-phase2a-input.mjs tests/axis-phase2a-builder.mjs tests/axis-phase2a-cli.mjs tests/axis-phase2a-jugest-runtime.mjs tests/axis-phase2a-walk-forward.mjs
      - name: Full regression suite
        run: npm test
      - name: Mandatory preservation regressions
        run: |
          node --test tests/production-preservation.mjs
          node --test tests/collector-batch-v3.mjs
          node tests/collector-preservation.mjs
          node tests/store-analysis-evidence-view.mjs
          node tests/store-optimization-research.mjs
          node --test tests/ui-home-jobs.mjs
