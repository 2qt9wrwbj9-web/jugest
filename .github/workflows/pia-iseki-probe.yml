name: PIA Isezaki probe

on:
  push:
    branches: [research/pia-api]
    paths: [.github/workflows/pia-iseki-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Isezaki ranking variants
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          BASE='https://pia-server.heuron.net/api/stores/'
          HDR={'Accept':'application/json','Content-Type':'application/x-www-form-urlencoded','User-Agent':'Mozilla/5.0'}
          def post(ep,data):
              req=urllib.request.Request(BASE+ep,data=urllib.parse.urlencode(data).encode(),headers=HDR,method='POST')
              with urllib.request.urlopen(req,timeout=20) as r: return json.loads(r.read().decode('utf-8','replace'))
          def best_list(obj):
              best=[]
              def walk(x):
                  nonlocal best
                  if isinstance(x,list):
                      if len(x)>len(best) and (not x or isinstance(x[0],dict)): best=x
                      for v in x: walk(v)
                  elif isinstance(x,dict):
                      for v in x.values(): walk(v)
              walk(obj); return best
          plans={
              11:['47','186','21.277','5.376','20','','46'],
              12:['47','200','21.277','5','20','','46']
          }
          for sid,prices in plans.items():
              print('STORE',sid)
              for price in prices:
                  body={'user_code':'','price':price,'kind':'1','machine_type':'2','day':'0','store_id':str(sid),'limit':'100'}
                  try:
                      rank=post('getRankingTop',body); rows=best_list(rank)
                      print('TRY',json.dumps({'sid':sid,'price':price,'status':rank.get('status'),'rows':len(rows),'sample':({k:rows[0].get(k) for k in ['machine_no','special_1','special_2d','difference','out','special_out']} if rows else None)},ensure_ascii=False))
                  except Exception as e:
                      print('ERR',json.dumps({'sid':sid,'price':price,'error':repr(e)},ensure_ascii=False))
          PY
