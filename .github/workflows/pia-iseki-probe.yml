name: PIA Isezaki probe

on:
  push:
    branches: [research/pia-api]
    paths: [.github/workflows/pia-iseki-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe direct machine API
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          BASE='https://pia-server.heuron.net/api/stores/'
          HDR={'Accept':'application/json','Content-Type':'application/x-www-form-urlencoded','User-Agent':'Mozilla/5.0'}
          def post(ep,data):
              req=urllib.request.Request(BASE+ep,data=urllib.parse.urlencode(data).encode(),headers=HDR,method='POST')
              with urllib.request.urlopen(req,timeout=20) as r: return json.loads(r.read().decode('utf-8','replace'))
          def summary(x):
              if not isinstance(x,dict): return {'type':type(x).__name__}
              out={'status':x.get('status'),'keys':list(x.keys())}
              for k in ('store_is_open','has_history','server_date_time'):
                  if k in x: out[k]=x.get(k)
              m=x.get('machine')
              if isinstance(m,dict):
                  out['machine_keys']=list(m.keys())
                  cur=m.get('current')
                  if isinstance(cur,dict): out['current']=cur
                  det=m.get('detail')
                  if isinstance(det,dict): out['detail']=det
                  elif isinstance(det,list): out['detail_count']=len(det); out['detail_sample']=det[0] if det else None
              return out
          for sid,name in [(11,'PIA伊勢佐木町'),(12,'PIA伊勢佐木3丁目')]:
              roster=post('getStoreMachiesWithHowToPlay',{'store_id':sid})
              slots=roster.get('slot') or []
              print('ROSTER_META',json.dumps({'sid':sid,'name':name,'status':roster.get('status'),'slot_models':len(slots),'slot_machine_total':sum(len(x.get('machine_nos') or []) for x in slots)},ensure_ascii=False))
              if not slots: continue
              model=next((x for x in slots if x.get('machine_nos')),slots[0])
              mno=(model.get('machine_nos') or [None])[0]
              code=model.get('sis_machine_code') or ''
              mname=model.get('name') or ''
              print('SAMPLE_MACHINE',json.dumps({'sid':sid,'machine_no':mno,'sis_machine_code':code,'machine_name':mname},ensure_ascii=False))
              for date in ('','0','2026-09-23','20260923','2026/09/23'):
                  body={'store_id':str(sid),'machine_no':str(mno),'sis_machine_code':code,'machine_name':mname,'user_code':'','date':date,'device_uuid':'','device_type':'1','app_version':'1.0.29'}
                  try:
                      res=post('getStoreMachine2',body)
                      print('DIRECT',json.dumps({'sid':sid,'date':date,'response':summary(res)},ensure_ascii=False))
                      if str(res.get('status'))=='0': break
                  except Exception as e:
                      print('ERR',json.dumps({'sid':sid,'date':date,'error':repr(e)},ensure_ascii=False))
          PY
