name: PIA Isezaki probe

on:
  push:
    branches: [research/pia-api]
    paths: [.github/workflows/pia-iseki-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover direct-machine request builder
        shell: bash
        env:
          XAPK_URL: "https://download.pureapk.com/b/XAPK/anAuY28ucGlhZ3JvdXAuYXBwXzE0OF82YTNmMmViZQ?as2=96e4607b6808b31a794d9d7f78543da66c8563b0&k=f8949fdaf447292cfb26ab4e47d1955b6c8563b0&_p=anAuY28ucGlhZ3JvdXAuYXBw&c=1%7CENTERTAINMENT%7Cb2lkPTlfZGV2PVBJQSUyMEdST1VQJnQ9eGFwayZzPTY1ODAwODQwJnZuPTEuMC4yOSZ2Yz0xNDg&_fn=UElBJUU1JTg1JUFDJUU1JUJDJThGJUUzJTgyJUEyJUUzJTgzJTk3JUUzJTgzJUFBXzEuMC4yOV9hcGtjb21iby5jb20ueGFwaw%3D%3D"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 -A 'Mozilla/5.0' "$XAPK_URL" -o pia.xapk
          mkdir -p xapk arm64 findings
          unzip -q pia.xapk -d xapk
          unzip -q xapk/config.arm64_v8a.apk -d arm64
          LIB=arm64/lib/arm64-v8a/libil2cpp.so
          test -f "$LIB"

          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/2qt9wrwbj9-web/jugest/actions/artifacts/10667924440/zip' \
            -o findings.zip
          unzip -q findings.zip -d findings
          test -f findings/string-slot-map.txt

          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu

          aarch64-linux-gnu-objdump -d --start-address=0x145dc40 --stop-address=0x145e1d4 "$LIB" > direct-machine.asm
          aarch64-linux-gnu-objdump -d --start-address=0x145ca98 --stop-address=0x145d090 "$LIB" > contain-all.asm

          python3 - <<'PY'
          import re
          targets={
            0x2c6a6b0:'ENDPOINT getStoreMachine2',
            0x2c6a6a0:'ENDPOINT getStoreMachineChart',
            0x2c6a8c0:'KEY store_id',
            0x2c6b558:'KEY machine_no',
            0x2c6a2c8:'KEY sis_machine_code',
            0x2c6b2f0:'KEY machine_name',
            0x2c6a2d8:'KEY user_code',
            0x2c6ad38:'KEY date',
            0x2c6a968:'KEY device_uuid',
            0x2c69f28:'KEY device_type',
            0x2c6a078:'KEY app_version',
            0x2c6b388:'KEY price',
            0x2c6aad8:'KEY machine_type',
            0x2c6a950:'KEY limit',
          }
          for fn in ('direct-machine.asm','contain-all.asm'):
            print('\n===',fn,'===')
            lines=open(fn).read().splitlines(); regs={}
            for i,line in enumerate(lines):
              m=re.search(r'\badrp\s+x(\d+),\s*([0-9a-f]+)',line)
              if m:
                regs[int(m.group(1))]=int(m.group(2),16); continue
              m=re.search(r'\bldr\s+x(\d+),\s*\[x(\d+),\s*#(\d+)\]',line)
              if not m: continue
              dst,base,off=map(int,m.groups())
              if base in regs:
                addr=regs[base]+off
                if addr in targets:
                  lo=max(0,i-3); hi=min(len(lines),i+5)
                  print(f'REF {targets[addr]} slot={addr:#x}')
                  print('\n'.join(lines[lo:hi]))
              if dst==base: regs.pop(dst,None)
          PY

          echo '=== Direct machine full body (filtered) ==='
          grep -nE 'adrp|ldr|str|bl|mov|fmov|scvtf' direct-machine.asm | head -900
