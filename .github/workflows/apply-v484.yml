name: Apply v4.8.4 collector upgrade

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-v484.py'
      - '.github/workflows/apply-v484.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply v4.8.4 patch
        run: python scripts/apply-v484.py
      - name: Update approved v4.8.4 launcher guards
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for p in Path('tests').glob('*.mjs'):
              s=p.read_text().replace("4.5.0","4.8.4")
              p.write_text(s)
          p=Path('tests/v473-relay-init.mjs')
          s=p.read_text()
          new_hash=hashlib.sha256(Path('ana-launcher.js').read_bytes()).hexdigest()
          s=s.replace('2481cbc8707e4a8803ce0da597331adfb80f37797b2b1d7a030b023f5fa74e67',new_hash)
          s=s.replace("BOOKMARKLET_v4500.txt","BOOKMARKLET_v4840.txt")
          s=s.replace('ana-launcher\\.js\\?v=4500','ana-launcher\\.js\\?v=4840')
          s=s.replace('beyond the reviewed Netlify-origin migration; bookmarklet/parser bump would need explicit review','beyond the reviewed v4.8.4 collector upgrade; further Launcher changes need explicit review')
          p.write_text(s)
          print('reviewed launcher sha256',new_hash)
          PY
      - name: Full regression suite
        run: npm test
      - name: Extra static debug sweep
        run: |
          node --check ana-launcher.js
          node --check hanahana-judge.js
          node --check hanahana-ui.js
          node --check netlify/functions/relay.mjs
          cmp index.html public/index.html
          cmp ana-launcher.js public/ana-launcher.js
          ! grep -R "https://jugest.netlify.app" index.html public/index.html ana-launcher.js public/ana-launcher.js BOOKMARKLET_v4840.txt public/BOOKMARKLET_v4840.txt netlify/functions/relay.mjs README.md
          ! grep -R "const ACCESS_WINDOW_MS=30\*60\*1000" ana-launcher.js public/ana-launcher.js
          grep -q "ジャグラー設定判別 v4.8.4" index.html
          grep -q "const VERSION='4.8.4'" ana-launcher.js
      - name: Commit verified v4.8.4
        run: |
          git config user.name "Hiro"
          git config user.email "2qt9wrwbj9@privaterelay.appleid.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Release v4.8.4 collector maintenance upgrade"
          git push origin HEAD:main
