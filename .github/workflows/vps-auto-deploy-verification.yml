name: VPS Auto Deploy Verification

on:
  push:
    branches:
      - sol/vps-auto-deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show Node version
        run: node --version
      - name: Run VPS tests
        working-directory: vps
        run: npm test
