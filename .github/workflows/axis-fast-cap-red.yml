name: Axis Fast Cap RED

on:
  push:
    branches:
      - sol/axis-phase2a-fast-runner

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test tests/axis-phase2a-fast-runner.mjs
