name: Inspect Ana-Slo structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-ana-structure.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe prefecture pages
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, re
          urls = [
            'https://ana-slo.com/%E3%83%9B%E3%83%BC%E3%83%AB%E3%83%87%E3%83%BC%E3%82%BF/%E7%A5%9E%E5%A5%88%E5%B7%9D%E7%9C%8C/',
            'https://ana-slo.com/%E5%87%BA%E3%81%A6%E3%81%9F%E3%81%8A%E5%BA%97/',
            'https://ana-slo.com/%E3%83%9B%E3%83%BC%E3%83%AB%E3%83%87%E3%83%BC%E3%82%BF/'
          ]
          for url in urls:
            print('\nURL', url)
            req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 Safari/605.1.15'})
            try:
              with urllib.request.urlopen(req, timeout=20) as r:
                html=r.read().decode('utf-8','replace')
                print('STATUS', r.status, 'FINAL', r.geturl(), 'LEN', len(html))
                links=re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',html,re.I|re.S)
                shown=0
                for href,text in links:
                  txt=re.sub(r'<[^>]+>',' ',text)
                  txt=re.sub(r'\s+',' ',txt).strip()
                  if txt and ('神奈川' in txt or 'ジアス' in txt or 'ホール' in txt or '-data/' in href):
                    print('LINK', txt[:80], '=>', href[:180])
                    shown += 1
                    if shown>=40: break
            except Exception as e:
              print('ERROR', type(e).__name__, e)
          PY
