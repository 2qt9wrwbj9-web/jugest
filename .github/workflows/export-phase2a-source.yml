name: Export Phase2A Source

on:
  push:
    branches:
      - sol/axis-phase2a-walk-forward

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack Phase 2A runtime source
        run: |
          mkdir -p /tmp/phase2a-source
          cp index.html hanahana-judge.js missing-inference.js core-v510.js sync-core.js package.json /tmp/phase2a-source/
          cp -R research /tmp/phase2a-source/
          cp -R scripts /tmp/phase2a-source/
          cp -R tests/helpers /tmp/phase2a-source/tests-helpers
          cd /tmp && zip -qr phase2a-source.zip phase2a-source
      - uses: actions/upload-artifact@v4
        with:
          name: phase2a-source
          path: /tmp/phase2a-source.zip
          retention-days: 1
