name: Apply v4.8.4 store registration hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v484-store-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed hotfix patch
        shell: bash
        run: |
          cat > /tmp/hotfix.patch.gz.b64 <<'PATCH'

PATCH
          base64 -d /tmp/hotfix.patch.gz.b64 | gunzip > /tmp/hotfix.patch
          git apply --check /tmp/hotfix.patch
          git apply /tmp/hotfix.patch
      - run: npm ci
      - run: npm test
      - name: Commit reviewed hotfix
        shell: bash
        run: |
          git config user.name "Hiro"
          git config user.email "2qt9wrwbj9@privaterelay.appleid.com"
          git add README.md ana-launcher.js public/ana-launcher.js package.json tests/v473-relay-init.mjs tests/v474-lazy-execution.mjs tests/v484-store-registration-hotfix.mjs
          git diff --cached --check
          git commit -m "Fix v4.8.4 store registration"
          git push
