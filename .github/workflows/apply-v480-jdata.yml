name: Apply v4.8.0 data-page update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v480-jdata.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply v4.8.0 patch
        run: node scripts/apply-v480-jdata.mjs
      - name: Normalize inherited release-version checks
        run: node scripts/normalize-late-regression-versions.mjs
      - name: Run full regression suite
        run: npm test
      - name: Commit v4.8.0
        run: |
          git config user.name "Hiro"
          git config user.email "2qt9wrwbj9@privaterelay.appleid.com"
          git add index.html public/index.html package.json tests/v460-ranking.mjs tests/v473-relay-init.mjs tests/v470-single-evidence.mjs tests/v471-performance-regression.mjs tests/v474-lazy-execution.mjs tests/v475-trend-roster.mjs tests/v476-hybrid-ranking.mjs tests/v477-hybrid-weight-optimizer.mjs tests/v478-runtime-hybrid.mjs tests/v479-evidence-contribution-ui.mjs tests/v480-jdata-setting-summary.mjs
          git rm scripts/apply-v480-jdata.mjs scripts/normalize-late-regression-versions.mjs .github/workflows/apply-v480-jdata.yml
          git commit -m "Release v4.8.0 data-page setting summaries"
          git push
# final retry after v4.7.9 UI guard cleanup
