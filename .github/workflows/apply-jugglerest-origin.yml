name: Apply jugglerest Netlify origin migration

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-jugglerest-netlify-origin.mjs
      - .github/workflows/apply-jugglerest-origin.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply origin patch
        run: node scripts/patch-jugglerest-netlify-origin.mjs
      - name: Run full regression suite
        run: npm test
      - name: Remove one-time migration files
        run: rm -f scripts/patch-jugglerest-netlify-origin.mjs .github/workflows/apply-jugglerest-origin.yml
      - name: Commit migration
        run: |
          git config user.name "Hiro"
          git config user.email "2qt9wrwbj9@privaterelay.appleid.com"
          git add -A
          git commit -m "Move Netlify production origin to jugglerest.netlify.app"
          git push
